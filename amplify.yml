version: 1
applications:
  - appRoot: platform
    frontend:
      phases:
        preBuild:
          commands:
            - npm install -g pnpm@9
            - cd .. && pnpm install
            - cd ../packages/memory-stack && pnpm run build
        build:
          commands:
            - pnpm build
      artifacts:
        baseDirectory: .next
        files:
          - "**/*"
      cache:
        paths:
          - .next/cache/**/*
          - node_modules/**/*
          - ../node_modules/**/*
          - ../packages/memory-stack/dist/**/*
