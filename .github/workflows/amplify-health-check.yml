name: Post-Deploy Health Check

on:
  # Trigger after CI passes on main (Amplify auto-deploys from main)
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

  # Manual trigger for debugging
  workflow_dispatch:
    inputs:
      url:
        description: 'Override base URL to check'
        required: false
        type: string

jobs:
  health-check:
    name: Verify Production Health
    runs-on: ubuntu-latest
    # Only run if CI succeeded (don't check health after a failed build)
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    timeout-minutes: 15

    steps:
      - name: Wait for Amplify deploy to propagate
        run: |
          echo "Waiting 120s for Amplify deploy to finish and propagate..."
          sleep 120

      - name: Check critical endpoints
        id: health
        # continue-on-error so transient network blips don't fail the workflow.
        # The "Create GitHub Issue" step checks step conclusion for real failures.
        continue-on-error: true
        run: |
          BASE_URL="${{ github.event.inputs.url || 'https://platform.usebrainos.com' }}"
          ENDPOINTS=("/login" "/signup" "/api/health")
          FAILED=0
          MAX_RETRIES=3
          RETRY_DELAY=30

          for path in "${ENDPOINTS[@]}"; do
            URL="${BASE_URL}${path}"
            SUCCESS=false

            for attempt in $(seq 1 $MAX_RETRIES); do
              echo "Checking ${URL} (attempt ${attempt}/${MAX_RETRIES})..."
              HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 "$URL" || echo "000")

              if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 400 ]; then
                echo "  ✅ ${path} → HTTP ${HTTP_CODE}"
                SUCCESS=true
                break
              elif [ "$attempt" -lt "$MAX_RETRIES" ]; then
                echo "  ⚠️  ${path} → HTTP ${HTTP_CODE} — retrying in ${RETRY_DELAY}s..."
                sleep $RETRY_DELAY
              fi
            done

            if [ "$SUCCESS" = false ]; then
              echo "  ❌ ${path} → HTTP ${HTTP_CODE} (failed after ${MAX_RETRIES} attempts)"
              FAILED=$((FAILED + 1))
            fi
          done

          echo ""
          if [ "$FAILED" -gt 0 ]; then
            echo "::error::${FAILED} endpoint(s) failed health check after ${MAX_RETRIES} retries!"
            exit 1
          else
            echo "✅ All endpoints healthy"
          fi

      - name: Create GitHub Issue on Failure
        # Uses step conclusion since health check has continue-on-error.
        # Only fires after all retries are exhausted — not for transient blips.
        if: steps.health.conclusion == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const title = '🚨 Production Health Check Failed After Deploy';
            const body = `
            ## Post-Deploy Health Check Failed

            **Workflow:** ${{ github.workflow }}
            **Triggered by:** CI completion on main
            **Run:** [View Details](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

            One or more critical endpoints returned errors after the latest deploy.

            ### Immediate Actions
            1. Check [Amplify Console](https://console.aws.amazon.com/amplify/) for deploy status
            2. Check the workflow run logs above for which endpoints failed
            3. If production is down, revert the last commit on main

            **This is an automated alert.**
            `;

            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'production,automated'
            });

            const existing = issues.data.find(i => i.title === title);
            if (!existing) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['production', 'automated', 'critical']
              });
            }
