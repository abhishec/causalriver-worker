name: Brain Refresh Cycles

# ============================================================================
# BRAIN REFRESH — SCHEDULED COGNITIVE CYCLES
# ============================================================================
#
# Why this exists:
#   BrainOS deploys on AWS Amplify, NOT Vercel. The vercel.json cron config
#   is ignored in production. This workflow provides the scheduled triggers
#   for all brain refresh cycles that would otherwise never run:
#
#   - /api/cron/cognitive-cycle       — runs L3-L15 cognitive stack, caches
#                                        insights to ai_memory for copilot (every 30m)
#   - /api/cron/process-jobs          — drains the SE-aaS agent_queue so brain
#                                        agents don't sit stuck (every 10m)
#   - /api/cron/learning              — learning cycle (every 4h)
#   - /api/cron/evolution             — brain evolution cycle (every 6h)
#   - /api/cron/autonomous-monitor    — 4 threshold checks, Slack alerts (every 10m)
#   - /api/cron/rlvr                  — ground-truth outcome verification (daily 3 AM)
#   - /api/brain/ingest-cc-learnings  — CC case-log + retro → Core Brain + federated
#                                        Tookitaki workspaces (daily 4 AM)
#
# Schedule design:
#   All four schedules share a single job. The 10-min and 30-min cycles run on
#   every trigger. The 4-hour and 6-hour cycles are gated by
#   `github.event.schedule` so they only fire on their respective triggers.
#   workflow_dispatch runs all four unconditionally (for manual testing).
#
# Auth: All cron endpoints require "Authorization: Bearer <CRON_SECRET>".
#   Set CRON_SECRET in GitHub → Settings → Secrets and variables → Actions.
#   Optionally set APP_URL to override the default production URL.
#
# Failure handling:
#   Each step uses `|| echo "::warning::..."` so a single endpoint failure
#   never blocks the rest of the job or marks the workflow run red.
# ============================================================================

on:
  schedule:
    - cron: '*/10 * * * *'   # Every 10 min  — process agent queue jobs
    - cron: '*/30 * * * *'   # Every 30 min  — cognitive cycle (L3-L15 cache)
    - cron: '0 */4 * * *'    # Every 4 hours — learning cycle
    - cron: '0 */6 * * *'    # Every 6 hours — evolution cycle
    - cron: '0 3 * * *'      # Daily 3 AM UTC — RLVR ground-truth verification
    - cron: '0 4 * * *'      # Daily 4 AM UTC — CC learnings ingestion (case-log + retro → brain)
  workflow_dispatch: {}      # Manual trigger — runs all endpoints

# Minimal permissions: only needs to call HTTPS endpoints, nothing in the repo.
permissions:
  contents: read

jobs:
  brain-refresh:
    name: Brain Refresh
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # ── Process Agent Queue Jobs (every 10-min and 30-min trigger) ──────────
      # Drains the SE-aaS agent_queue so brain agents don't sit stuck waiting
      # for a user request to trigger them.
      - name: Process Agent Queue Jobs
        run: |
          BASE_URL="${{ secrets.APP_URL || 'https://platform.usebrainos.com' }}"
          echo "Calling ${BASE_URL}/api/cron/process-jobs ..."
          curl -f -s -X GET \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            --max-time 60 \
            "${BASE_URL}/api/cron/process-jobs" \
            || echo "::warning::process-jobs endpoint failed (non-fatal — jobs will be retried on next trigger)"

      # ── Cognitive Cycle (every 10-min and 30-min trigger) ───────────────────
      # Runs L3-L15 cognitive stack for active orgs and persists insights to
      # ai_memory so copilot responses benefit from the full cognitive stack
      # without blocking the request path.
      - name: Cognitive Cycle (L3-L15 cache)
        run: |
          BASE_URL="${{ secrets.APP_URL || 'https://platform.usebrainos.com' }}"
          echo "Calling ${BASE_URL}/api/cron/cognitive-cycle ..."
          curl -f -s -X GET \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            --max-time 300 \
            "${BASE_URL}/api/cron/cognitive-cycle" \
            || echo "::warning::cognitive-cycle endpoint failed (non-fatal — copilot falls back to cached insights)"

      # ── Evolution Cycle (only on 6-hour trigger or manual dispatch) ─────────
      # Brain evolution cycle: promotes patterns, prunes weak edges, advances
      # cognitive architecture. Skipped on 10-min and 30-min triggers.
      - name: Evolution Cycle (6-hour boundary only)
        if: ${{ github.event.schedule == '0 */6 * * *' || github.event_name == 'workflow_dispatch' }}
        run: |
          BASE_URL="${{ secrets.APP_URL || 'https://platform.usebrainos.com' }}"
          echo "Calling ${BASE_URL}/api/cron/evolution ..."
          curl -f -s -X GET \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            --max-time 300 \
            "${BASE_URL}/api/cron/evolution" \
            || echo "::warning::evolution endpoint failed (non-fatal — will retry at next 6-hour boundary)"

      # ── Learning Cycle (only on 4-hour trigger or manual dispatch) ──────────
      # Reinforcement learning cycle: updates prediction weights, processes
      # feedback signals, adjusts UCB1 bandit scores. Skipped on 10-min and
      # 30-min triggers.
      - name: Learning Cycle (4-hour boundary only)
        if: ${{ github.event.schedule == '0 */4 * * *' || github.event_name == 'workflow_dispatch' }}
        run: |
          BASE_URL="${{ secrets.APP_URL || 'https://platform.usebrainos.com' }}"
          echo "Calling ${BASE_URL}/api/cron/learning ..."
          curl -f -s -X GET \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            --max-time 300 \
            "${BASE_URL}/api/cron/learning" \
            || echo "::warning::learning endpoint failed (non-fatal — will retry at next 4-hour boundary)"

      # ── Connector Signal Analyzer (only on 4-hour trigger or manual dispatch) ──
      # Groups recent connector signals (GitHub, Jira, Slack etc.) by domain,
      # runs Haiku LLM on each batch to extract patterns/trends/risks, and
      # stores the derived understanding into ai_memory. This is how 100% of
      # connector data becomes brain knowledge — not just hand-coded heuristics.
      - name: Connector Signal Analyzer (4-hour boundary only)
        if: ${{ github.event.schedule == '0 */4 * * *' || github.event_name == 'workflow_dispatch' }}
        run: |
          BASE_URL="${{ secrets.APP_URL || 'https://platform.usebrainos.com' }}"
          echo "Calling ${BASE_URL}/api/brain/analyze-signals ..."
          curl -s -X GET \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            --max-time 300 \
            "${BASE_URL}/api/brain/analyze-signals" \
            || echo "analyze-signals failed (non-fatal)"

      # ── Document Embedding Backfill (every 30-min and 4-hour trigger) ────────
      # Generates n-gram embeddings for document_chunks rows where embedding IS NULL.
      # Processes max 50 chunks per call to stay within Lambda timeout.
      # Safe to call repeatedly — idempotent, only touches NULL-embedding rows.
      - name: Document Embedding Backfill
        if: ${{ github.event.schedule == '*/30 * * * *' || github.event.schedule == '0 */4 * * *' || github.event_name == 'workflow_dispatch' }}
        run: |
          BASE_URL="${{ secrets.APP_URL || 'https://platform.usebrainos.com' }}"
          echo "Calling ${BASE_URL}/api/brain/embed-documents ..."
          curl -f -s -X GET \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            --max-time 300 \
            "${BASE_URL}/api/brain/embed-documents" \
            || echo "::warning::embed-documents endpoint failed (non-fatal — chunks will remain NULL until next run)"

      # ── Autonomous Monitor (every 10-min trigger) ────────────────────────────
      # Checks 4 thresholds: flight-risk (>50%), eng health (<60%), scope-creep
      # alerts, signal velocity. Fires Slack alerts with 6-hour dedup so the
      # brain proactively surfaces risks without spamming the team.
      - name: Autonomous Monitor
        if: ${{ github.event.schedule == '*/10 * * * *' || github.event_name == 'workflow_dispatch' }}
        run: |
          BASE_URL="${{ secrets.APP_URL || 'https://platform.usebrainos.com' }}"
          echo "Calling ${BASE_URL}/api/cron/autonomous-monitor ..."
          curl -s -X GET \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            --max-time 60 \
            "${BASE_URL}/api/cron/autonomous-monitor" \
            || echo "autonomous-monitor failed (non-fatal)"

      # ── CC Learning Consolidation (only on 4-hour trigger or manual dispatch) ─
      # Reads ai_memory records written by the command center in the last 8 hours
      # (event_source IN command_center_session, git_commit_training,
      # orchestration_intelligence), uses Haiku to synthesise a rolling digest,
      # and upserts "session.cc_consolidation" back into ai_memory so the brain
      # carries forward what the CC learned each day — not just individual commits.
      - name: CC Learning Consolidation (4-hour boundary)
        if: ${{ github.event.schedule == '0 */4 * * *' || github.event_name == 'workflow_dispatch' }}
        run: |
          BASE_URL="${{ secrets.APP_URL || 'https://platform.usebrainos.com' }}"
          echo "Calling ${BASE_URL}/api/brain/cc-learning ..."
          curl -s -X GET \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            --max-time 120 \
            "${BASE_URL}/api/brain/cc-learning" \
            || echo "cc-learning consolidation failed (non-fatal)"

      # ── RLVR Ground-Truth Verification (daily 3 AM UTC) ─────────────────────
      # Compares AI predictions to actual outcomes (churn, scope-creep, health
      # deltas). Applies asymmetric RL rewards: +0.1 correct, -0.05 wrong.
      # 45-day verify window for early-warning predictions.
      - name: RLVR Ground-Truth Verification
        if: ${{ github.event.schedule == '0 3 * * *' || github.event_name == 'workflow_dispatch' }}
        run: |
          BASE_URL="${{ secrets.APP_URL || 'https://platform.usebrainos.com' }}"
          echo "Calling ${BASE_URL}/api/cron/rlvr ..."
          curl -s -X GET \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            --max-time 300 \
            "${BASE_URL}/api/cron/rlvr" \
            || echo "rlvr verification failed (non-fatal)"

      # ── CC Learnings Ingestion (daily 4 AM UTC) ───────────────────────────────
      # Parses .claude/case-log.md and .claude/cc-retro.md and writes each section
      # as an ai_memory row (domain=cc-learnings / cc-retro) and a knowledge_chunks
      # row (Tier 1 RAG) into the Core Brain. High-priority entries ([USER CORRECTION],
      # CRITICAL, ⚠️) are federated to both Tookitaki AI worker space org IDs.
      # Idempotent: source_id hash deduplication prevents duplicate rows on re-runs.
      - name: CC Learnings Ingestion (daily 4 AM UTC)
        if: ${{ github.event.schedule == '0 4 * * *' || github.event_name == 'workflow_dispatch' }}
        run: |
          BASE_URL="${{ secrets.APP_URL || 'https://platform.usebrainos.com' }}"
          echo "Calling ${BASE_URL}/api/brain/ingest-cc-learnings ..."
          curl -s -X POST \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            --max-time 120 \
            "${BASE_URL}/api/brain/ingest-cc-learnings" \
            || echo "ingest-cc-learnings failed (non-fatal — will retry at next daily trigger)"

      # ── Process Writeback Queue (every 10-min trigger) ────────────────────────
      # Drains writeback_queue: sends Slack messages, creates Jira tickets, opens
      # GitHub issues after SE-aaS domain executions. Keeps the Brain→Action→World
      # loop closed. Max 3 attempts per item with exponential backoff.
      - name: Process Writeback Queue
        run: |
          BASE_URL="${{ secrets.APP_URL || 'https://platform.usebrainos.com' }}"
          echo "Calling ${BASE_URL}/api/cron/process-writeback ..."
          curl -s -X GET \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            --max-time 120 \
            "${BASE_URL}/api/cron/process-writeback" \
            || echo "process-writeback failed (non-fatal)"

      # ── Memory Cleanup (daily 3 AM UTC) ──────────────────────────────────────
      # Removes stale rows from cross_domain_signals (>90d), prediction_records
      # (>90d), brain_case_log (>180d), agent_queue completed rows (>30d).
      # Prevents unbounded table growth without losing meaningful learning history.
      - name: Memory Cleanup
        if: ${{ github.event.schedule == '0 3 * * *' || github.event_name == 'workflow_dispatch' }}
        run: |
          BASE_URL="${{ secrets.APP_URL || 'https://platform.usebrainos.com' }}"
          echo "Calling ${BASE_URL}/api/cron/cleanup-memory ..."
          curl -s -X GET \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            --max-time 60 \
            "${BASE_URL}/api/cron/cleanup-memory" \
            || echo "cleanup-memory failed (non-fatal)"

      # ── Brain Consolidation (only on 4-hour trigger or manual dispatch) ────────
      # Tier-3 pattern consolidation: clusters high-quality cross_domain_signals
      # (strength >= 0.72) and prediction_records (quality >= 0.75) into
      # consolidated_patterns — the long-term compressed memory of the Brain.
      - name: Brain Consolidation (4-hour boundary only)
        if: ${{ github.event.schedule == '0 */4 * * *' || github.event_name == 'workflow_dispatch' }}
        run: |
          BASE_URL="${{ secrets.APP_URL || 'https://platform.usebrainos.com' }}"
          echo "Calling ${BASE_URL}/api/cron/consolidate ..."
          curl -s -X GET \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            --max-time 300 \
            "${BASE_URL}/api/cron/consolidate" \
            || echo "consolidate failed (non-fatal)"
