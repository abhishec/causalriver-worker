name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 20, 22]

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Run tests
        run: pnpm test

      - name: Brain Health Checkup (Neurological Exam)
        run: cd packages/memory-stack && pnpm test:brain-health
        if: matrix.node-version == 20

      - name: Brain Benchmarks (Regression Testing)
        run: cd packages/memory-stack && pnpm test:benchmark
        if: matrix.node-version == 20

      - name: Check coverage
        run: pnpm test:coverage
        if: matrix.node-version == 20

  # Week 2: Platform build verification
  platform-build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Build memory-stack (workspace dependency)
        run: pnpm --filter @nexus-ai/memory-stack run build

      - name: Build platform
        run: cd platform && pnpm build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
          SUPABASE_SERVICE_ROLE_KEY: placeholder
          ANTHROPIC_API_KEY: placeholder

  # Week 2: Migration validation (lint SQL, check for breaking changes)
  migration-check:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for new migrations
        run: |
          CHANGED_MIGRATIONS=$(git diff --name-only origin/main...HEAD -- 'supabase/migrations/*.sql')
          if [ -n "$CHANGED_MIGRATIONS" ]; then
            echo "New/modified migrations detected:"
            echo "$CHANGED_MIGRATIONS"
            echo ""
            echo "Checking for dangerous patterns..."

            # Check for DROP TABLE without IF EXISTS
            if grep -rn "DROP TABLE " $CHANGED_MIGRATIONS | grep -v "IF EXISTS"; then
              echo "⚠️ WARNING: DROP TABLE without IF EXISTS detected"
            fi

            # Check for DELETE without WHERE
            if grep -rn "DELETE FROM" $CHANGED_MIGRATIONS | grep -v "WHERE"; then
              echo "⚠️ WARNING: DELETE without WHERE clause detected"
            fi

            # Check for ALTER TABLE DROP COLUMN
            if grep -rn "DROP COLUMN" $CHANGED_MIGRATIONS; then
              echo "⚠️ WARNING: Column drop detected — ensure backward compatibility"
            fi

            echo "✅ Migration check complete"
          else
            echo "No migration changes detected"
          fi
