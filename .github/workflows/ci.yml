name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 20, 22]

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Run tests
        run: pnpm test

      - name: Brain Health Checkup (Neurological Exam)
        run: cd packages/memory-stack && pnpm test:brain-health
        if: matrix.node-version == 20

      - name: Brain Benchmarks (Regression Testing)
        run: cd packages/memory-stack && pnpm test:benchmark
        if: matrix.node-version == 20

      - name: Check coverage
        run: pnpm test:coverage
        if: matrix.node-version == 20
