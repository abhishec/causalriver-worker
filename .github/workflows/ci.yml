name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]  # Node 18 EOL — dropped for security

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Run tests
        run: pnpm test
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Brain Health Checkup (Neurological Exam)
        run: cd packages/memory-stack && pnpm test:brain-health
        if: matrix.node-version == 20
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Brain Benchmarks (Regression Testing)
        run: cd packages/memory-stack && pnpm test:benchmark
        if: matrix.node-version == 20
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Check coverage
        run: pnpm test:coverage
        if: matrix.node-version == 20
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Build memory-stack (required for platform tsc)
        # The platform imports @nexus-ai/memory-stack which resolves to dist/index.d.ts.
        # dist/ is gitignored — must be built before tsc can type-check platform routes.
        run: pnpm --filter @nexus-ai/memory-stack run build
        if: matrix.node-version == 20
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - name: TypeScript type check (platform)
        run: cd platform && pnpm exec tsc --noEmit
        if: matrix.node-version == 20
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Lint platform
        run: cd platform && pnpm lint
        if: matrix.node-version == 20
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Lint website
        run: cd website && pnpm lint
        if: matrix.node-version == 20
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Brain cold-start regression guard (NB-032)
        # Fails CI if brain cold-start exceeds 3000ms budget.
        # Budget: 3000ms — raised from 2500ms to accommodate CI runners.
        # If this step fails, the brain package has grown too heavy for cold-start.
        # Fix: profile what was added and optimise or raise budget deliberately.
        run: |
          cd packages/memory-stack
          START=$(date +%s%N)
          node --max-old-space-size=4096 -e "
            const { NexusBrain } = require('./dist/index.js');
            const brain = new NexusBrain({ orgId: 'ci-cold-start-test', supabaseUrl: 'https://placeholder.supabase.co', supabaseKey: 'placeholder' });
          " 2>/dev/null || true
          END=$(date +%s%N)
          ELAPSED=$(( (END - START) / 1000000 ))
          echo "Brain cold-start: ${ELAPSED}ms (budget: 3000ms)"
          if [ "$ELAPSED" -gt 3000 ]; then
            echo "::error::NB-032: Brain cold-start ${ELAPSED}ms exceeds 3000ms budget. Profile memory-stack additions."
            exit 1
          fi
          echo "✅ Cold-start within budget"
        if: matrix.node-version == 20
        env:
          NODE_OPTIONS: --max-old-space-size=4096

  # Platform build verification
  platform-build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Build memory-stack (workspace dependency)
        run: pnpm --filter @nexus-ai/memory-stack run build
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Build platform
        run: cd platform && pnpm build
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          NEXT_PUBLIC_SUPABASE_URL: https://ci-build-check.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-build-check-anon
          SUPABASE_SERVICE_ROLE_KEY: ci-build-check-service
          ANTHROPIC_API_KEY: sk-ant-ci-build-check

  # Docker build validation — catches Dockerfile issues before deploy
  docker-build:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (brain orchestrator)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: nexusbrain-trainer:ci-test
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Apply migrations on main branch deploy
  migrate:
    runs-on: ubuntu-latest
    needs: [test, platform-build]
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      vars.SUPABASE_PROJECT_REF != ''
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link Supabase project
        run: supabase link --project-ref ${{ vars.SUPABASE_PROJECT_REF }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Apply pending migrations
        # --include-all: apply migrations even if their timestamp is before the
        # latest already-applied migration. This is needed because new migrations
        # are sometimes created with earlier timestamps (backfill/hotfix pattern).
        run: supabase db push --linked --include-all
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

  # Migration validation (lint SQL, check for breaking changes)
  migration-check:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for new migrations
        run: |
          CHANGED_MIGRATIONS=$(git diff --name-only origin/main...HEAD -- 'supabase/migrations/*.sql')
          if [ -n "$CHANGED_MIGRATIONS" ]; then
            echo "New/modified migrations detected:"
            echo "$CHANGED_MIGRATIONS"
            echo ""

            # ── Duplicate timestamp check ─────────────────────────────────
            echo "Checking for duplicate migration timestamps..."
            ALL_TIMESTAMPS=$(ls supabase/migrations/*.sql | xargs -I{} basename {} | cut -d'_' -f1 | sort)
            DUPES=$(echo "$ALL_TIMESTAMPS" | uniq -d)
            if [ -n "$DUPES" ]; then
              echo "::error::DUPLICATE MIGRATION TIMESTAMPS DETECTED: $DUPES"
              echo "Two migration files share the same timestamp — this will cause a primary key violation."
              echo "Rename one of the conflicting files with a later timestamp."
              exit 1
            fi
            echo "✅ No duplicate timestamps"

            # ── Out-of-order warning ──────────────────────────────────────
            echo ""
            echo "Checking for out-of-order migrations..."
            LATEST_MAIN=$(git show origin/main:supabase/migrations/ 2>/dev/null | grep '.sql' | sort | tail -1 | sed 's/.*\///' | cut -d'_' -f1 || echo "0")
            NEW_MIGRATIONS=$(echo "$CHANGED_MIGRATIONS" | xargs -I{} basename {} | cut -d'_' -f1 | sort)
            OUT_OF_ORDER=""
            for TS in $NEW_MIGRATIONS; do
              if [ "$TS" \< "$LATEST_MAIN" ]; then
                OUT_OF_ORDER="$OUT_OF_ORDER $TS"
              fi
            done
            if [ -n "$OUT_OF_ORDER" ]; then
              echo "::warning::OUT-OF-ORDER MIGRATIONS:$OUT_OF_ORDER"
              echo "These migrations have timestamps before the current latest on main ($LATEST_MAIN)."
              echo "The deploy uses --include-all to handle this, but consider using the current date prefix."
            else
              echo "✅ All new migrations are in order"
            fi

            echo ""
            echo "Checking for dangerous SQL patterns..."

            # Check for DROP TABLE without IF EXISTS
            if grep -rn "DROP TABLE " $CHANGED_MIGRATIONS | grep -v "IF EXISTS"; then
              echo "WARNING: DROP TABLE without IF EXISTS detected"
            fi

            # Check for DELETE without WHERE
            if grep -rn "DELETE FROM" $CHANGED_MIGRATIONS | grep -v "WHERE"; then
              echo "WARNING: DELETE without WHERE clause detected"
            fi

            # Check for ALTER TABLE DROP COLUMN
            if grep -rn "DROP COLUMN" $CHANGED_MIGRATIONS; then
              echo "WARNING: Column drop detected — ensure backward compatibility"
            fi

            # Check for missing IF NOT EXISTS on CREATE TABLE
            if grep -rn "CREATE TABLE " $CHANGED_MIGRATIONS | grep -v "IF NOT EXISTS"; then
              echo "WARNING: CREATE TABLE without IF NOT EXISTS — migration not idempotent"
            fi

            echo "Migration check complete"
          else
            echo "No migration changes detected"
          fi
