name: CI Self-Heal

# ============================================================================
# AUTOMATED CI SELF-HEALING PIPELINE
# ============================================================================
#
# This workflow is triggered AFTER a CI failure. It has TWO healing modes:
#
# 1. LIGHTWEIGHT HEAL (always runs, no deps needed):
#    - Fetches failed CI logs via `gh` CLI
#    - Diagnoses common failures (lockfile drift, type errors, lint, flaky)
#    - Auto-fixes lockfile drift by regenerating pnpm-lock.yaml
#    - Auto-retries transient/flaky failures
#    - Creates GitHub issues for non-healable failures
#
# 2. FULL AGENT HEAL (runs if deps install succeeds):
#    - Runs the full CI Healer Agent (BaseTrainingAgent)
#    - Stores failure patterns as brain signals for learning
#    - Creates fix PRs with lint --fix, type corrections
#
# The lightweight heal ensures the healer NEVER fails due to broken deps.
#
# Safety:
#   - Max 3 heal attempts per failure (prevents infinite loops)
#   - Non-destructive: creates PRs for review, doesn't push to main
#   - Only auto-fixes safe changes (lockfile, lint)
#   - Structural fixes always require human review
#
# ============================================================================

on:
  # Trigger when CI workflow completes with failure
  workflow_run:
    workflows: ["CI"]
    types:
      - completed

  # Manual trigger for specific run analysis
  workflow_dispatch:
    inputs:
      run_id:
        description: 'GitHub Actions Run ID to analyze'
        required: false
        type: string
      mode:
        description: 'Healing mode'
        required: true
        default: 'heal'
        type: choice
        options:
          - heal
          - diagnose
          - retry

# Prevent concurrent heal runs
concurrency:
  group: ci-self-heal-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------
  # Gate: Only run if CI actually failed
  # ---------------------------------------------------------------
  check-failure:
    name: Check CI Status
    runs-on: ubuntu-latest
    outputs:
      should_heal: ${{ steps.check.outputs.should_heal }}
      run_id: ${{ steps.check.outputs.run_id }}
    steps:
      - name: Evaluate trigger
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual trigger — proceeding"
            echo "should_heal=true" >> $GITHUB_OUTPUT
            echo "run_id=${{ github.event.inputs.run_id || '' }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.event.workflow_run.conclusion }}" = "failure" ]; then
            FAILED_RUN_ID="${{ github.event.workflow_run.id }}"

            # ── Retry cap: max 3 attempts per run ──────────────────────
            ATTEMPT=$(gh run view "$FAILED_RUN_ID" --json attempt --jq '.attempt' 2>/dev/null || echo "1")
            if [ "$ATTEMPT" -ge 3 ]; then
              echo "::warning::Run $FAILED_RUN_ID already at attempt $ATTEMPT (max 3). Skipping heal to prevent retry storm."
              echo "should_heal=false" >> $GITHUB_OUTPUT
              echo "run_id=" >> $GITHUB_OUTPUT
              exit 0
            fi

            # ── Staleness check: skip runs older than 30 minutes ───────
            RUN_CREATED=$(gh run view "$FAILED_RUN_ID" --json createdAt --jq '.createdAt' 2>/dev/null || echo "")
            if [ -n "$RUN_CREATED" ]; then
              RUN_EPOCH=$(date -d "$RUN_CREATED" +%s 2>/dev/null || date -j -f "%Y-%m-%dT%H:%M:%SZ" "$RUN_CREATED" +%s 2>/dev/null || echo "0")
              NOW_EPOCH=$(date +%s)
              AGE_MINUTES=$(( (NOW_EPOCH - RUN_EPOCH) / 60 ))
              if [ "$AGE_MINUTES" -gt 30 ]; then
                echo "::warning::Run $FAILED_RUN_ID is ${AGE_MINUTES}min old (>30min). Skipping stale failure."
                echo "should_heal=false" >> $GITHUB_OUTPUT
                echo "run_id=" >> $GITHUB_OUTPUT
                exit 0
              fi
            fi

            echo "CI failed (attempt $ATTEMPT) — triggering self-heal"
            echo "should_heal=true" >> $GITHUB_OUTPUT
            echo "run_id=$FAILED_RUN_ID" >> $GITHUB_OUTPUT
          else
            echo "CI passed — no healing needed"
            echo "should_heal=false" >> $GITHUB_OUTPUT
            echo "run_id=" >> $GITHUB_OUTPUT
          fi

  # ---------------------------------------------------------------
  # Lightweight Heal: No deps needed, always works
  # ---------------------------------------------------------------
  lightweight-heal:
    name: Lightweight Heal
    runs-on: ubuntu-latest
    needs: check-failure
    if: needs.check-failure.outputs.should_heal == 'true'
    timeout-minutes: 10
    outputs:
      diagnosis: ${{ steps.diagnose.outputs.diagnosis }}
      healed: ${{ steps.auto-fix.outputs.healed }}
      needs_full_heal: ${{ steps.diagnose.outputs.needs_full_heal }}

    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "NexusBrain CI Healer"
          git config user.email "ci-healer@nexusbrain.ai"

      - name: Diagnose failure from logs
        id: diagnose
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ needs.check-failure.outputs.run_id }}
        run: |
          echo "=== CI Healer: Lightweight Diagnosis ==="
          echo ""

          # Get the failed run ID
          if [ -z "$RUN_ID" ]; then
            echo "No run ID — scanning recent failures..."
            RUN_ID=$(gh run list --status failure --limit 1 --json databaseId --jq '.[0].databaseId')
          fi

          if [ -z "$RUN_ID" ]; then
            echo "No failures found"
            echo "diagnosis=none" >> $GITHUB_OUTPUT
            echo "needs_full_heal=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "Analyzing run: $RUN_ID"

          # Fetch failed logs
          LOGS=$(gh run view "$RUN_ID" --log-failed 2>/dev/null || echo "")

          if [ -z "$LOGS" ]; then
            echo "Could not fetch logs"
            echo "diagnosis=unknown" >> $GITHUB_OUTPUT
            echo "needs_full_heal=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Classify the failure
          DIAGNOSIS="unknown"
          NEEDS_FULL="true"

          if echo "$LOGS" | grep -qi "ERR_PNPM_OUTDATED_LOCKFILE\|frozen-lockfile\|lockfile is not up to date"; then
            DIAGNOSIS="lockfile_drift"
            NEEDS_FULL="false"
            echo "🔧 Detected: LOCKFILE DRIFT — auto-fixable"
          elif echo "$LOGS" | grep -qi "ERR_PNPM_\|pnpm.*not found\|ENOENT.*pnpm"; then
            DIAGNOSIS="pnpm_error"
            NEEDS_FULL="false"
            echo "🔧 Detected: PNPM ERROR — will retry"
          elif echo "$LOGS" | grep -qi "error TS[0-9]\+:\|has no exported member\|Cannot find module\|not assignable"; then
            DIAGNOSIS="typescript_error"
            NEEDS_FULL="true"
            echo "⚠️  Detected: TYPESCRIPT ERROR — needs review"
          elif echo "$LOGS" | grep -qi "eslint\|lint.*failed"; then
            DIAGNOSIS="lint_error"
            NEEDS_FULL="true"
            echo "⚠️  Detected: LINT ERROR — may be auto-fixable"
          elif echo "$LOGS" | grep -qi "FAIL.*\.test\.\|Tests:.*failed\|AssertionError"; then
            DIAGNOSIS="test_failure"
            NEEDS_FULL="true"
            echo "⚠️  Detected: TEST FAILURE — needs review"
          elif echo "$LOGS" | grep -qi "Timed out\|ETIMEDOUT\|ECONNREFUSED\|socket hang up"; then
            DIAGNOSIS="transient"
            NEEDS_FULL="false"
            echo "🔧 Detected: TRANSIENT FAILURE — will retry"
          elif echo "$LOGS" | grep -qi "docker.*build.*failed\|COPY failed"; then
            DIAGNOSIS="docker_failure"
            NEEDS_FULL="true"
            echo "⚠️  Detected: DOCKER BUILD FAILURE — needs review"
          fi

          echo ""
          echo "Diagnosis: $DIAGNOSIS"
          echo "Needs full heal: $NEEDS_FULL"
          echo "diagnosis=$DIAGNOSIS" >> $GITHUB_OUTPUT
          echo "needs_full_heal=$NEEDS_FULL" >> $GITHUB_OUTPUT
          echo "run_id=$RUN_ID" >> $GITHUB_OUTPUT

          # Save last 200 lines of error for the issue
          echo "$LOGS" | grep -i "error\|ERR_\|failed\|Cannot\|not found" | tail -30 > /tmp/error_excerpt.txt

      - name: Auto-fix lockfile drift
        id: auto-fix
        if: steps.diagnose.outputs.diagnosis == 'lockfile_drift'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "=== Auto-fixing lockfile drift ==="

          # Install pnpm for lockfile regeneration
          npm install -g pnpm@9

          # Regenerate lockfile
          pnpm install --no-frozen-lockfile

          # Check if lockfile actually changed
          if git diff --quiet pnpm-lock.yaml; then
            echo "Lockfile unchanged — nothing to fix"
            echo "healed=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Commit directly to main (lockfile is safe to auto-fix)
          git add pnpm-lock.yaml
          git commit -m "fix(ci): regenerate pnpm-lock.yaml [auto-healed]

          Lockfile was out of sync with package.json, causing ERR_PNPM_OUTDATED_LOCKFILE.
          Auto-fixed by NexusBrain CI Healer Agent.

          Co-Authored-By: NexusBrain CI Healer <ci-healer@nexusbrain.ai>"

          git push origin main

          echo "✅ Lockfile regenerated and pushed to main"
          echo "healed=true" >> $GITHUB_OUTPUT

      - name: Auto-retry transient failures
        if: steps.diagnose.outputs.diagnosis == 'transient' || steps.diagnose.outputs.diagnosis == 'pnpm_error'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ needs.check-failure.outputs.run_id }}
        run: |
          echo "=== Retrying transient failure ==="
          if [ -n "$RUN_ID" ]; then
            # Safety: check attempt count before re-running
            ATTEMPT=$(gh run view "$RUN_ID" --json attempt --jq '.attempt' 2>/dev/null || echo "1")
            if [ "$ATTEMPT" -ge 3 ]; then
              echo "::warning::Max retry attempts (3) reached. Not re-running."
              exit 0
            fi
            gh run rerun "$RUN_ID" --failed
            echo "✅ Re-triggered failed jobs (attempt $ATTEMPT → $((ATTEMPT+1)))"
          fi

      - name: Create diagnosis issue for non-healable failures
        if: steps.diagnose.outputs.needs_full_heal == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ needs.check-failure.outputs.run_id }}
          DIAGNOSIS: ${{ steps.diagnose.outputs.diagnosis }}
        run: |
          TITLE="CI Healer: $DIAGNOSIS in CI run"

          # Check for existing open issue
          EXISTING=$(gh issue list --label "ci-healer,automated" --state open --json number,title --jq ".[].title" 2>/dev/null || echo "")
          if echo "$EXISTING" | grep -qF "$TITLE"; then
            echo "Issue already exists — skipping"
            exit 0
          fi

          ERROR_EXCERPT=""
          if [ -f /tmp/error_excerpt.txt ]; then
            ERROR_EXCERPT=$(cat /tmp/error_excerpt.txt | head -20)
          fi

          BODY="## CI Failure — Auto-Diagnosed

          **Diagnosis:** \`$DIAGNOSIS\`
          **Run:** [View Details](https://github.com/${{ github.repository }}/actions/runs/$RUN_ID)
          **Branch:** \`${{ github.ref_name }}\`

          ### Error Excerpt
          \`\`\`
          $ERROR_EXCERPT
          \`\`\`

          ### What to do
          - Check the [workflow logs](https://github.com/${{ github.repository }}/actions/runs/$RUN_ID)
          - Fix the issue and push
          - CI Healer will auto-close this once CI goes green

          _Auto-created by NexusBrain CI Healer Agent_"

          gh issue create --title "$TITLE" --body "$BODY" --label "ci-healer,automated" || echo "Issue creation failed (non-fatal)"

  # ---------------------------------------------------------------
  # Full Agent Heal: Only if lightweight didn't fully resolve it
  # ---------------------------------------------------------------
  full-heal:
    name: Full Agent Heal
    runs-on: ubuntu-latest
    needs: [check-failure, lightweight-heal]
    if: |
      always() &&
      needs.check-failure.outputs.should_heal == 'true' &&
      needs.lightweight-heal.outputs.needs_full_heal == 'true'
    timeout-minutes: 15

    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        id: install
        # MUST use --no-frozen-lockfile because the healer runs AFTER CI fails
        run: pnpm install --no-frozen-lockfile
        continue-on-error: true

      - name: Build memory-stack
        if: steps.install.outcome == 'success'
        run: pnpm --filter @nexus-ai/memory-stack run build
        continue-on-error: true

      - name: Configure git
        run: |
          git config user.name "NexusBrain CI Healer"
          git config user.email "ci-healer@nexusbrain.ai"

      - name: Run CI Healer Agent
        if: steps.install.outcome == 'success'
        id: heal
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CI_RUN_ID: ${{ needs.check-failure.outputs.run_id }}
          CI_HEAL_MODE: ${{ github.event.inputs.mode || 'heal' }}
          CI_HEAL_ATTEMPT: '1'
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          echo "=== CI Healer Agent (Full Mode) ==="
          pnpm exec tsx scripts/run-ci-healer.ts
        continue-on-error: true

      - name: Fallback — agent couldn't run
        if: steps.install.outcome != 'success'
        run: |
          echo "::warning::Full agent heal skipped — dependencies failed to install."
          echo "The lightweight heal should have handled common cases."
          echo "Check the lightweight-heal job for diagnosis."

      - name: Upload Heal Report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-heal-report-${{ github.run_number }}
          path: ci-heal-report-*.json
          retention-days: 30
          if-no-files-found: ignore

  # ---------------------------------------------------------------
  # Summary
  # ---------------------------------------------------------------
  summary:
    name: Heal Summary
    runs-on: ubuntu-latest
    needs: [check-failure, lightweight-heal, full-heal]
    if: always() && needs.check-failure.outputs.should_heal == 'true'
    steps:
      - name: Post summary
        run: |
          echo "## CI Self-Heal Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Trigger** | ${{ github.event_name }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Failed Run** | #${{ needs.check-failure.outputs.run_id }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Diagnosis** | ${{ needs.lightweight-heal.outputs.diagnosis }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Lightweight Heal** | ${{ needs.lightweight-heal.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Full Agent Heal** | ${{ needs.full-heal.result || 'skipped' }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "_NexusBrain CI Healer Agent v1.1.0_" >> $GITHUB_STEP_SUMMARY
