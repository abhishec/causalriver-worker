name: CI Self-Heal

# ============================================================================
# AUTOMATED CI SELF-HEALING PIPELINE
# ============================================================================
#
# This workflow is triggered AFTER a CI failure. It runs the CI Healer Agent
# which diagnoses failures, attempts auto-fixes, and creates issues/PRs.
#
# Trigger Chain:
#   CI fails → ci-self-heal triggers → CI Healer Agent runs → Fix/Issue/Retry
#
# Safety:
#   - Max 3 heal attempts per failure (prevents infinite loops)
#   - Non-destructive: creates PRs for review, doesn't push to main
#   - Only auto-fixes safe changes (lockfile, lint)
#   - Structural fixes always require human review
#
# ============================================================================

on:
  # Trigger when CI workflow completes with failure
  workflow_run:
    workflows: ["CI"]
    types:
      - completed

  # Manual trigger for specific run analysis
  workflow_dispatch:
    inputs:
      run_id:
        description: 'GitHub Actions Run ID to analyze'
        required: false
        type: string
      mode:
        description: 'Healing mode'
        required: true
        default: 'heal'
        type: choice
        options:
          - heal
          - diagnose
          - retry

# Prevent concurrent heal runs
concurrency:
  group: ci-self-heal-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------
  # Gate: Only run if CI actually failed
  # ---------------------------------------------------------------
  check-failure:
    name: Check CI Status
    runs-on: ubuntu-latest
    outputs:
      should_heal: ${{ steps.check.outputs.should_heal }}
      run_id: ${{ steps.check.outputs.run_id }}
    steps:
      - name: Evaluate trigger
        id: check
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual trigger — proceeding"
            echo "should_heal=true" >> $GITHUB_OUTPUT
            echo "run_id=${{ github.event.inputs.run_id || '' }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.event.workflow_run.conclusion }}" = "failure" ]; then
            echo "CI failed — triggering self-heal"
            echo "should_heal=true" >> $GITHUB_OUTPUT
            echo "run_id=${{ github.event.workflow_run.id }}" >> $GITHUB_OUTPUT
          else
            echo "CI passed — no healing needed"
            echo "should_heal=false" >> $GITHUB_OUTPUT
            echo "run_id=" >> $GITHUB_OUTPUT
          fi

  # ---------------------------------------------------------------
  # Heal: Run the CI Healer Agent
  # ---------------------------------------------------------------
  heal:
    name: Self-Heal CI
    runs-on: ubuntu-latest
    needs: check-failure
    if: needs.check-failure.outputs.should_heal == 'true'
    timeout-minutes: 15

    permissions:
      contents: write       # Create fix branches/commits
      pull-requests: write   # Create fix PRs
      issues: write          # Create diagnosis issues
      actions: write         # Re-trigger workflows

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Use a token that can push branches and create PRs
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        # MUST use --no-frozen-lockfile because the healer runs AFTER CI fails
        # and lockfile drift is one of the most common failure causes
        run: pnpm install --no-frozen-lockfile

      - name: Build memory-stack
        run: pnpm --filter @nexus-ai/memory-stack run build
        continue-on-error: true  # Build may fail — healer still needs to diagnose

      - name: Configure git for auto-fix commits
        run: |
          git config user.name "NexusBrain CI Healer"
          git config user.email "ci-healer@nexusbrain.ai"

      - name: Run CI Healer Agent
        id: heal
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CI_RUN_ID: ${{ needs.check-failure.outputs.run_id }}
          CI_HEAL_MODE: ${{ github.event.inputs.mode || 'heal' }}
          CI_HEAL_ATTEMPT: '1'
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          echo "=== CI Healer Agent Starting ==="
          echo "Run ID: $CI_RUN_ID"
          echo "Mode: $CI_HEAL_MODE"
          echo "Repository: $GITHUB_REPOSITORY"
          echo ""

          # Run the healer agent
          pnpm exec tsx scripts/run-ci-healer.ts

      - name: Upload Heal Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-heal-report-${{ github.run_number }}
          path: |
            ci-heal-report-*.json
          retention-days: 30
          if-no-files-found: ignore

  # ---------------------------------------------------------------
  # Summary: Post results
  # ---------------------------------------------------------------
  summary:
    name: Heal Summary
    runs-on: ubuntu-latest
    needs: [check-failure, heal]
    if: always() && needs.check-failure.outputs.should_heal == 'true'
    steps:
      - name: Post summary
        run: |
          echo "## CI Self-Heal Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Trigger:** ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Failed Run:** #${{ needs.check-failure.outputs.run_id }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Heal Status:** ${{ needs.heal.result }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "_NexusBrain CI Healer Agent v1.0.0_" >> $GITHUB_STEP_SUMMARY
