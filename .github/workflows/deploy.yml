name: Deploy to Production

# ============================================================================
# UNIFIED PRODUCTION DEPLOYMENT WORKFLOW
# ============================================================================
#
# This is the ONLY workflow that deploys to production. It is completely
# separated from CI — CI tests/validates, this workflow deploys.
#
# Key Principles:
# ─────────────────
# 1. MANUAL ONLY — Never auto-triggered by CI or pushes
# 2. DROPDOWN SELECTION — Choose what to deploy (platform, orchestrator, both)
# 3. HARD GATES — Build failure always blocks deploy; no skipped=ok loopholes
# 4. PRE-FLIGHT VALIDATION — Re-runs TypeScript hard check before deploying
# 5. RELIABLE ECS WAIT — Custom polling loop; not aws ecs wait (10-min limit)
# 6. ROLLBACK INFO — Captures previous image digest for quick rollback
# 7. SLACK NOTIFICATION — Success/failure alerts
#
# Usage:
#   1. Go to Actions → "Deploy to Production"
#   2. Click "Run workflow"
#   3. Select target (platform, orchestrator, both)
#   4. Select environment (production, staging)
#   5. Confirm: select "yes - deploy" from dropdown
#   6. Monitor progress
#
# ============================================================================

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'What to deploy'
        required: true
        default: 'platform'
        type: choice
        options:
          - platform
          - orchestrator
          - both
      environment:
        description: 'Target environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging
      confirm_deploy:
        description: 'Confirm deployment'
        required: true
        default: 'no'
        type: choice
        options:
          - 'no'
          - 'yes - deploy'
      skip_tests:
        description: 'Skip pre-deployment tests (emergency only)'
        required: false
        type: boolean
        default: false

env:
  AWS_REGION: us-east-1
  ECS_CLUSTER: nexusbrain-training
  ORCHESTRATOR_ECR: nexusbrain-trainer
  PLATFORM_ECR: nexusbrain-platform
  PLATFORM_SERVICE: nexusbrain-platform-service
  ORCHESTRATOR_SERVICE: nexusbrain-orchestrator-service

jobs:
  # ---------------------------------------------------------------
  # Gate: Validate deployment confirmation
  # ---------------------------------------------------------------
  gate:
    name: Deployment Gate
    runs-on: ubuntu-latest
    outputs:
      deploy_platform: ${{ steps.validate.outputs.deploy_platform }}
      deploy_orchestrator: ${{ steps.validate.outputs.deploy_orchestrator }}
    steps:
      - name: Validate confirmation
        id: validate
        run: |
          if [ "${{ inputs.confirm_deploy }}" != "yes - deploy" ]; then
            echo "::error::Deployment not confirmed. Select 'yes - deploy' in the confirmation dropdown."
            exit 1
          fi

          echo "Deployment confirmed for: ${{ inputs.target }} → ${{ inputs.environment }}"

          case "${{ inputs.target }}" in
            platform)
              echo "deploy_platform=true" >> $GITHUB_OUTPUT
              echo "deploy_orchestrator=false" >> $GITHUB_OUTPUT
              ;;
            orchestrator)
              echo "deploy_platform=false" >> $GITHUB_OUTPUT
              echo "deploy_orchestrator=true" >> $GITHUB_OUTPUT
              ;;
            both)
              echo "deploy_platform=true" >> $GITHUB_OUTPUT
              echo "deploy_orchestrator=true" >> $GITHUB_OUTPUT
              ;;
          esac

  # ---------------------------------------------------------------
  # Pre-Flight: Validate before deploying
  # ---------------------------------------------------------------
  preflight:
    name: Pre-Flight Validation
    runs-on: ubuntu-latest
    needs: gate
    if: inputs.skip_tests != true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build memory-stack (required for platform tsc)
        run: pnpm --filter @nexus-ai/memory-stack run build
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      # TypeScript is a HARD gate — type errors must never reach production.
      - name: TypeScript check (platform)
        run: cd platform && pnpm exec tsc --noEmit
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      # Tests run with continue-on-error — they already passed in CI.
      # The TS hard gate above is what actually blocks a bad deploy.
      - name: Run tests
        run: pnpm test
        continue-on-error: true
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Security audit
        run: pnpm audit --audit-level=high || true

      - name: Pre-flight passed
        run: echo "✅ All pre-flight checks passed"

  # ---------------------------------------------------------------
  # Migrate: Run DB migrations before any code deploys
  # ---------------------------------------------------------------
  migrate:
    name: Run DB Migrations
    runs-on: ubuntu-latest
    needs: [gate, preflight]
    if: |
      always() &&
      needs.gate.result == 'success' &&
      (needs.preflight.result == 'success' || needs.preflight.result == 'skipped') &&
      vars.SUPABASE_PROJECT_REF != ''
    outputs:
      migrations_applied: ${{ steps.push.outputs.migrations_applied }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link Supabase project
        run: supabase link --project-ref ${{ vars.SUPABASE_PROJECT_REF }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Apply pending migrations
        id: push
        run: |
          set +e
          supabase db push --linked --include-all 2>&1 | tee /tmp/migrate-output.txt
          EXIT_CODE=${PIPESTATUS[0]}
          echo "--- supabase exit code: $EXIT_CODE ---"
          if [ $EXIT_CODE -ne 0 ]; then
            echo "::error::Migration failed — see output above"
            exit $EXIT_CODE
          fi
          if grep -q "Applying migration" /tmp/migrate-output.txt; then
            echo "migrations_applied=true" >> $GITHUB_OUTPUT
            echo "✅ Migrations applied"
          else
            echo "migrations_applied=false" >> $GITHUB_OUTPUT
            echo "✅ No pending migrations — DB is up to date"
          fi
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      - name: Verify no drift remains
        run: |
          supabase db push --linked --dry-run 2>&1 | tee /tmp/drift-output.txt || true
          if grep -q "Applying migration" /tmp/drift-output.txt; then
            echo "::error::Migration drift detected after push — some migrations may have failed"
            exit 1
          fi
          echo "✅ DB schema matches migrations — no drift"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      - name: Migration summary
        run: |
          echo "## 🗄️ Migration Status" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Applied** | ${{ steps.push.outputs.migrations_applied }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Project** | \`${{ vars.SUPABASE_PROJECT_REF }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Drift check** | ✅ Clean |" >> $GITHUB_STEP_SUMMARY

  # ---------------------------------------------------------------
  # Build Platform Docker Image
  # ---------------------------------------------------------------
  build-platform:
    name: Build Platform Image
    runs-on: ubuntu-latest
    needs: [gate, preflight]
    timeout-minutes: 45
    if: |
      always() &&
      needs.gate.result == 'success' &&
      (needs.preflight.result == 'success' || needs.preflight.result == 'skipped') &&
      needs.gate.outputs.deploy_platform == 'true'
    outputs:
      image-uri: ${{ steps.build.outputs.image-uri }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Capture previous image for rollback
        id: previous
        run: |
          PREV_TAG=$(aws ecr describe-images \
            --repository-name ${{ env.PLATFORM_ECR }} \
            --image-ids imageTag=latest \
            --query 'imageDetails[0].imageDigest' \
            --output text 2>/dev/null || echo "none")
          echo "previous_digest=$PREV_TAG" >> $GITHUB_OUTPUT
          echo "Previous platform image: $PREV_TAG"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push platform image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./platform/Dockerfile
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.PLATFORM_ECR }}:latest
            ${{ steps.login-ecr.outputs.registry }}/${{ env.PLATFORM_ECR }}:${{ github.sha }}
            ${{ steps.login-ecr.outputs.registry }}/${{ env.PLATFORM_ECR }}:deploy-${{ github.run_number }}
          build-args: |
            NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          cache-from: |
            type=gha
            type=registry,ref=${{ steps.login-ecr.outputs.registry }}/${{ env.PLATFORM_ECR }}:buildcache
          cache-to: |
            type=gha,mode=max
            type=registry,ref=${{ steps.login-ecr.outputs.registry }}/${{ env.PLATFORM_ECR }}:buildcache,mode=max,image-manifest=true
          platforms: linux/amd64

      - name: Output image URI
        run: |
          echo "image-uri=${{ steps.login-ecr.outputs.registry }}/${{ env.PLATFORM_ECR }}:${{ github.sha }}" >> $GITHUB_OUTPUT

  # ---------------------------------------------------------------
  # Build Orchestrator Docker Image
  # ---------------------------------------------------------------
  build-orchestrator:
    name: Build Orchestrator Image
    runs-on: ubuntu-latest
    needs: [gate, preflight]
    timeout-minutes: 45
    if: |
      always() &&
      needs.gate.result == 'success' &&
      (needs.preflight.result == 'success' || needs.preflight.result == 'skipped') &&
      needs.gate.outputs.deploy_orchestrator == 'true'
    outputs:
      image-uri: ${{ steps.build.outputs.image-uri }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Capture previous image for rollback
        id: previous
        run: |
          PREV_TAG=$(aws ecr describe-images \
            --repository-name ${{ env.ORCHESTRATOR_ECR }} \
            --image-ids imageTag=latest \
            --query 'imageDetails[0].imageDigest' \
            --output text 2>/dev/null || echo "none")
          echo "previous_digest=$PREV_TAG" >> $GITHUB_OUTPUT
          echo "Previous orchestrator image: $PREV_TAG"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push orchestrator image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ORCHESTRATOR_ECR }}:latest
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ORCHESTRATOR_ECR }}:${{ github.sha }}
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ORCHESTRATOR_ECR }}:deploy-${{ github.run_number }}
          cache-from: |
            type=gha
            type=registry,ref=${{ steps.login-ecr.outputs.registry }}/${{ env.ORCHESTRATOR_ECR }}:buildcache
          cache-to: |
            type=gha,mode=max
            type=registry,ref=${{ steps.login-ecr.outputs.registry }}/${{ env.ORCHESTRATOR_ECR }}:buildcache,mode=max,image-manifest=true
          platforms: linux/amd64

      - name: Output image URI
        run: |
          echo "image-uri=${{ steps.login-ecr.outputs.registry }}/${{ env.ORCHESTRATOR_ECR }}:${{ github.sha }}" >> $GITHUB_OUTPUT

  # ---------------------------------------------------------------
  # Deploy to ECS
  # HARD GATES: only runs if every needed job actually succeeded.
  # 'skipped' is only allowed for jobs the target doesn't need
  # (e.g. build-orchestrator when target=platform).
  # ---------------------------------------------------------------
  deploy:
    name: Deploy to ${{ inputs.environment }}
    runs-on: ubuntu-latest
    needs: [gate, preflight, migrate, build-platform, build-orchestrator]
    if: |
      always() &&
      needs.gate.result == 'success' &&
      (needs.preflight.result == 'success' || needs.preflight.result == 'skipped') &&
      (needs.migrate.result == 'success' || needs.migrate.result == 'skipped') &&
      (needs.build-platform.result == 'success' || needs.build-platform.result == 'skipped') &&
      (needs.build-orchestrator.result == 'success' || needs.build-orchestrator.result == 'skipped') &&
      needs.build-platform.result != 'failure' &&
      needs.build-orchestrator.result != 'failure'
    environment: ${{ inputs.environment }}
    env:
      PLATFORM_URL: ${{ vars.PLATFORM_URL }}

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # ── Deploy Platform ──────────────────────────────────────────
      - name: Deploy Platform to ECS
        if: needs.gate.outputs.deploy_platform == 'true'
        run: |
          echo "🚀 Deploying Platform to ECS..."
          # minimumHealthyPercent=0  → ECS stops the old task before starting the new
          #   one. Required because Fargate vCPU quota is tight (many trainer tasks running).
          #   Brief ~30s downtime is acceptable; a hung 10-min wait is not.
          # maximumPercent=200  → required by ECS when AZ Rebalancing is ENABLED.
          #   Setting ≤100 throws InvalidParameterException.
          aws ecs update-service \
            --cluster ${{ env.ECS_CLUSTER }} \
            --service ${{ env.PLATFORM_SERVICE }} \
            --force-new-deployment \
            --deployment-configuration minimumHealthyPercent=0,maximumPercent=200 \
            --region ${{ env.AWS_REGION }}
          echo "✅ ECS update-service accepted"

      # Custom polling loop — replaces `aws ecs wait services-stable` which:
      #   • Has a hard 10-min (40-poll × 15s) AWS CLI limit that returns exit 255
      #   • Gives no progress feedback during the wait
      #   • Can't distinguish "still starting" from "crash-looping"
      - name: Wait for Platform ECS stability
        if: needs.gate.outputs.deploy_platform == 'true'
        run: |
          echo "⏳ Polling ECS until platform service is stable (up to 15 min)..."
          MAX_POLLS=60       # 60 × 15s = 15 minutes
          POLL_INTERVAL=15
          STABLE_NEEDED=2    # require 2 consecutive stable readings before declaring success

          consecutive_stable=0

          for i in $(seq 1 $MAX_POLLS); do
            # Fetch the PRIMARY deployment's runningCount and desiredCount
            RESULT=$(aws ecs describe-services \
              --cluster ${{ env.ECS_CLUSTER }} \
              --services ${{ env.PLATFORM_SERVICE }} \
              --region ${{ env.AWS_REGION }} \
              --query 'services[0].deployments[?status==`PRIMARY`].[runningCount,desiredCount,rolloutState]' \
              --output text 2>&1)

            RUNNING=$(echo "$RESULT" | awk '{print $1}')
            DESIRED=$(echo "$RESULT" | awk '{print $2}')
            STATE=$(echo "$RESULT" | awk '{print $3}')

            echo "  Poll $i/$MAX_POLLS — running:$RUNNING desired:$DESIRED state:$STATE"

            if [ "$STATE" = "FAILED" ]; then
              echo "::error::ECS deployment entered FAILED rollout state — tasks crashed."
              echo "::error::Check CloudWatch logs: /ecs/nexusbrain-training (stream prefix: platform)"
              exit 1
            fi

            if [ "$STATE" = "COMPLETED" ] && [ "$RUNNING" = "$DESIRED" ] && [ "$RUNNING" -gt 0 ]; then
              consecutive_stable=$((consecutive_stable + 1))
              echo "  ✅ Stable reading $consecutive_stable/$STABLE_NEEDED"
              if [ "$consecutive_stable" -ge "$STABLE_NEEDED" ]; then
                echo "✅ Platform service is stable ($RUNNING/$DESIRED running)"
                break
              fi
            else
              consecutive_stable=0
            fi

            if [ "$i" -eq "$MAX_POLLS" ]; then
              echo "::error::Platform did not stabilize after $((MAX_POLLS * POLL_INTERVAL))s."
              echo "::error::Last state: running=$RUNNING desired=$DESIRED rolloutState=$STATE"
              echo "::error::Check ECS: cluster=${{ env.ECS_CLUSTER }} service=${{ env.PLATFORM_SERVICE }}"
              exit 1
            fi

            sleep $POLL_INTERVAL
          done

      # ── Deploy Orchestrator ──────────────────────────────────────
      - name: Deploy Orchestrator to ECS
        if: needs.gate.outputs.deploy_orchestrator == 'true'
        run: |
          echo "🚀 Deploying Orchestrator..."
          # Orchestrator runs as scheduled ECS tasks, not a persistent service.
          # update-service may not exist — treat failure as a warning not an error.
          if ! aws ecs update-service \
            --cluster ${{ env.ECS_CLUSTER }} \
            --service ${{ env.ORCHESTRATOR_SERVICE }} \
            --force-new-deployment \
            --deployment-configuration minimumHealthyPercent=0,maximumPercent=200 \
            --region ${{ env.AWS_REGION }} 2>&1; then
            echo "::warning::Orchestrator ECS service '${{ env.ORCHESTRATOR_SERVICE }}' update failed."
            echo "::warning::Scheduled tasks will pick up :latest on next scheduled run. Platform unaffected."
          else
            echo "✅ Orchestrator ECS update-service accepted"
          fi

      # ── Health Check ─────────────────────────────────────────────
      - name: Wait for platform /api/health to return 200
        if: needs.gate.outputs.deploy_platform == 'true' && vars.PLATFORM_URL != ''
        run: |
          echo "⏳ Waiting for platform health endpoint to respond..."
          # Use /api/health not / — the root redirects (307) which curl follows,
          # hitting login page. /api/health returns 200 JSON when healthy.
          HEALTH_URL="${PLATFORM_URL%/}/api/health"
          MAX_RETRIES=20
          RETRY_DELAY=15

          for i in $(seq 1 $MAX_RETRIES); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "$HEALTH_URL" || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "✅ Platform health check passed (attempt $i) — HTTP $STATUS"
              break
            fi
            echo "  Attempt $i/$MAX_RETRIES — HTTP $STATUS — retrying in ${RETRY_DELAY}s..."
            sleep $RETRY_DELAY
            if [ "$i" = "$MAX_RETRIES" ]; then
              echo "::warning::Platform health check did not return 200 after $((MAX_RETRIES * RETRY_DELAY))s (got HTTP $STATUS)"
              echo "::warning::Platform may still be starting up — check ECS logs if it remains unhealthy"
              # Warn only — ECS already confirmed the task is running & stable above
            fi
          done

      - name: Verify platform health response
        if: needs.gate.outputs.deploy_platform == 'true' && vars.PLATFORM_URL != ''
        run: |
          echo "🗄️  Verifying platform health response..."
          HEALTH_URL="${PLATFORM_URL%/}/api/health"
          RESPONSE=$(curl -s --max-time 10 "$HEALTH_URL" || echo '{"status":"unreachable"}')
          echo "$RESPONSE"

          STATUS=$(echo "$RESPONSE" | python3 -c \
            "import sys,json; d=json.load(sys.stdin); print(d.get('status','unknown'))" \
            2>/dev/null || echo "unknown")

          if [ "$STATUS" = "healthy" ] || [ "$STATUS" = "ok" ]; then
            echo "✅ Platform healthy — DB connection live"
          else
            echo "::warning::Platform returned status '$STATUS' — check ECS logs if issue persists"
          fi

          echo "## 🏥 Post-Deploy Health" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Platform status** | \`$STATUS\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Migrations applied** | ${{ needs.migrate.outputs.migrations_applied || 'skipped' }} |" >> $GITHUB_STEP_SUMMARY

      # ── Verify ECR images ─────────────────────────────────────────
      - name: Verify deployments
        run: |
          echo "Verifying ECR images..."

          if [ "${{ needs.gate.outputs.deploy_platform }}" = "true" ]; then
            echo "=== Platform ==="
            aws ecr describe-images \
              --repository-name ${{ env.PLATFORM_ECR }} \
              --image-ids imageTag=latest \
              --query 'imageDetails[0].{pushed: imagePushedAt, size: imageSizeInBytes, digest: imageDigest}' \
              --output table
          fi

          if [ "${{ needs.gate.outputs.deploy_orchestrator }}" = "true" ]; then
            echo "=== Orchestrator ==="
            aws ecr describe-images \
              --repository-name ${{ env.ORCHESTRATOR_ECR }} \
              --image-ids imageTag=latest \
              --query 'imageDetails[0].{pushed: imagePushedAt, size: imageSizeInBytes, digest: imageDigest}' \
              --output table
          fi

      # ── Summary ──────────────────────────────────────────────────
      - name: Deployment summary
        run: |
          echo "## 🚀 Production Deployment Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Target** | ${{ inputs.target }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Environment** | ${{ inputs.environment }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Commit** | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Deployed by** | ${{ github.actor }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Deploy #** | ${{ github.run_number }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Cluster** | ${{ env.ECS_CLUSTER }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Region** | ${{ env.AWS_REGION }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Deployed Components" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ needs.gate.outputs.deploy_platform }}" = "true" ]; then
            echo "- ✅ **Platform** → \`${{ env.PLATFORM_ECR }}:${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          fi
          if [ "${{ needs.gate.outputs.deploy_orchestrator }}" = "true" ]; then
            echo "- ✅ **Orchestrator** → \`${{ env.ORCHESTRATOR_ECR }}:${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Rollback" >> $GITHUB_STEP_SUMMARY
          echo "To rollback, re-run this workflow on the previous commit or use:" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "aws ecs update-service --cluster ${{ env.ECS_CLUSTER }} --service <SERVICE> --force-new-deployment --deployment-configuration minimumHealthyPercent=0,maximumPercent=200" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "All ECS task definitions reference \`:latest\` — they will automatically pick up the previous image." >> $GITHUB_STEP_SUMMARY

  # ---------------------------------------------------------------
  # Notification
  # ---------------------------------------------------------------
  notify:
    name: Notify
    runs-on: ubuntu-latest
    needs: [gate, deploy]
    if: always()
    steps:
      - name: Send Slack notification
        if: env.SLACK_WEBHOOK_URL != ''
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          STATUS="${{ needs.deploy.result == 'success' && '✅ SUCCESS' || '❌ FAILED' }}"
          TARGET="${{ inputs.target }}"
          ENV="${{ inputs.environment }}"

          curl -s -X POST "$SLACK_WEBHOOK_URL" \
            -H 'Content-Type: application/json' \
            -d "{
              \"text\": \"NexusBrain Deploy ${STATUS}\",
              \"blocks\": [
                {
                  \"type\": \"section\",
                  \"text\": {
                    \"type\": \"mrkdwn\",
