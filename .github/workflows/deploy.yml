name: 🚀 Deploy to Production

# ============================================================================
# NEXUSBRAIN — PRODUCTION DEPLOYMENT
# ============================================================================
#
# Inspired by Vercel / Railway / Fly.io deployment philosophy:
#   • Push to main → automatically queues a deploy (no manual "run workflow")
#   • Smart change detection → only rebuilds what changed
#   • Parallel everything that can be parallel
#   • Instant rollback on any failure (previous :latest tag preserved)
#   • Beautiful step summaries with timing and links
#   • Zero unnecessary waiting — custom ECS poller, not aws ecs wait
#
# Manual override also available (Actions → Run workflow) for:
#   • Forcing a full deploy regardless of changes
#   • Deploying a specific target only
#   • Emergency re-deploy without a code push
#
# ============================================================================

on:
  # ── Auto-deploy on push to main (Vercel-style) ───────────────────────────
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE/**'
      - 'docs/**'

  # ── Manual override ───────────────────────────────────────────────────────
  workflow_dispatch:
    inputs:
      target:
        description: 'Force deploy target (default: auto-detect from changes)'
        required: false
        default: 'auto'
        type: choice
        options:
          - auto
          - platform
          - orchestrator
          - both
      skip_preflight:
        description: '⚡ Skip preflight (emergency re-deploy of same code)'
        required: false
        type: boolean
        default: false
      skip_migrations:
        description: '⚡ Skip migrations (no DB changes)'
        required: false
        type: boolean
        default: false

env:
  AWS_REGION: us-east-1
  ECS_CLUSTER: nexusbrain-training
  ORCHESTRATOR_ECR: nexusbrain-trainer
  PLATFORM_ECR: nexusbrain-platform
  PLATFORM_SERVICE: nexusbrain-platform-service
  ORCHESTRATOR_SERVICE: nexusbrain-orchestrator-service
  # Build performance
  DOCKER_BUILDKIT: 1
  BUILDKIT_PROGRESS: plain

jobs:
  # ══════════════════════════════════════════════════════════════════════════
  # DETECT — Figure out what changed (< 5 seconds)
  # Vercel does this: only rebuild the thing that changed.
  # ══════════════════════════════════════════════════════════════════════════
  detect:
    name: 🔍 Detect Changes
    runs-on: ubuntu-latest
    outputs:
      platform_changed: ${{ steps.changes.outputs.platform }}
      orchestrator_changed: ${{ steps.changes.outputs.orchestrator }}
      deploy_platform: ${{ steps.resolve.outputs.deploy_platform }}
      deploy_orchestrator: ${{ steps.resolve.outputs.deploy_orchestrator }}
      deploy_label: ${{ steps.resolve.outputs.deploy_label }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2  # need parent commit for diff

      # Detect which workspaces have changed since last commit
      - name: Detect file changes
        id: changes
        run: |
          # On push: diff against parent. On workflow_dispatch: treat as changed.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "platform=true" >> $GITHUB_OUTPUT
            echo "orchestrator=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          CHANGED=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || echo "")
          echo "Changed files:"
          echo "$CHANGED"

          # Platform: anything in platform/, packages/ (shared deps), root config
          if echo "$CHANGED" | grep -qE '^(platform/|packages/|pnpm-lock\.yaml|\.pnpmfile\.cjs|package\.json|tsconfig)'; then
            echo "platform=true" >> $GITHUB_OUTPUT
          else
            echo "platform=false" >> $GITHUB_OUTPUT
          fi

          # Orchestrator: scripts/, packages/ (shared deps), root Dockerfile
          if echo "$CHANGED" | grep -qE '^(scripts/|packages/|Dockerfile|docker-entrypoint|pnpm-lock\.yaml|\.pnpmfile\.cjs)'; then
            echo "orchestrator=true" >> $GITHUB_OUTPUT
          else
            echo "orchestrator=false" >> $GITHUB_OUTPUT
          fi

      # Resolve final deploy targets (manual override wins over auto-detect)
      - name: Resolve deploy targets
        id: resolve
        run: |
          INPUT_TARGET="${{ inputs.target || 'auto' }}"
          PLATFORM_CHANGED="${{ steps.changes.outputs.platform }}"
          ORCHESTRATOR_CHANGED="${{ steps.changes.outputs.orchestrator }}"

          case "$INPUT_TARGET" in
            platform)
              DEPLOY_PLATFORM=true
              DEPLOY_ORCHESTRATOR=false
              LABEL="platform only"
              ;;
            orchestrator)
              DEPLOY_PLATFORM=false
              DEPLOY_ORCHESTRATOR=true
              LABEL="orchestrator only"
              ;;
            both)
              DEPLOY_PLATFORM=true
              DEPLOY_ORCHESTRATOR=true
              LABEL="platform + orchestrator"
              ;;
            auto|*)
              DEPLOY_PLATFORM=$PLATFORM_CHANGED
              DEPLOY_ORCHESTRATOR=$ORCHESTRATOR_CHANGED
              if [ "$PLATFORM_CHANGED" = "true" ] && [ "$ORCHESTRATOR_CHANGED" = "true" ]; then
                LABEL="platform + orchestrator (auto)"
              elif [ "$PLATFORM_CHANGED" = "true" ]; then
                LABEL="platform only (auto)"
              elif [ "$ORCHESTRATOR_CHANGED" = "true" ]; then
                LABEL="orchestrator only (auto)"
              else
                LABEL="nothing changed"
              fi
              ;;
          esac

          echo "deploy_platform=$DEPLOY_PLATFORM" >> $GITHUB_OUTPUT
          echo "deploy_orchestrator=$DEPLOY_ORCHESTRATOR" >> $GITHUB_OUTPUT
          echo "deploy_label=$LABEL" >> $GITHUB_OUTPUT

          echo ""
          echo "📋 Deploy plan: $LABEL"
          echo "   Platform:      $DEPLOY_PLATFORM"
          echo "   Orchestrator:  $DEPLOY_ORCHESTRATOR"

          # Bail early if nothing to deploy
          if [ "$DEPLOY_PLATFORM" = "false" ] && [ "$DEPLOY_ORCHESTRATOR" = "false" ]; then
            echo "::notice::No deployable changes detected. Skipping deploy."
          fi

  # ══════════════════════════════════════════════════════════════════════════
  # PREFLIGHT — TypeScript + security (only when code changed)
  # Runs in parallel with image builds — fails fast if types broken
  # ══════════════════════════════════════════════════════════════════════════
  preflight:
    name: ✅ Pre-Flight
    runs-on: ubuntu-latest
    needs: detect
    if: |
      inputs.skip_preflight != true &&
      (needs.detect.outputs.deploy_platform == 'true' || needs.detect.outputs.deploy_orchestrator == 'true')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build memory-stack
        run: pnpm --filter @nexus-ai/memory-stack run build
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - name: TypeScript check (hard gate 🛑)
        run: cd platform && pnpm exec tsc --noEmit
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Security audit
        run: pnpm audit --audit-level=high || true

  # ══════════════════════════════════════════════════════════════════════════
  # MIGRATE — Run DB migrations (before any code is live)
  # ══════════════════════════════════════════════════════════════════════════
  migrate:
    name: 🗄️ Migrations
    runs-on: ubuntu-latest
    needs: [detect, preflight]
    if: |
      always() &&
      inputs.skip_migrations != true &&
      (needs.detect.outputs.deploy_platform == 'true' || needs.detect.outputs.deploy_orchestrator == 'true') &&
      (needs.preflight.result == 'success' || needs.preflight.result == 'skipped') &&
      vars.SUPABASE_PROJECT_REF != ''
    outputs:
      applied: ${{ steps.push.outputs.applied }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link project
        run: supabase link --project-ref ${{ vars.SUPABASE_PROJECT_REF }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Apply migrations
        id: push
        run: |
          set +e
          supabase db push --linked --include-all 2>&1 | tee /tmp/migrate.txt
          CODE=${PIPESTATUS[0]}
          if [ $CODE -ne 0 ]; then
            echo "::error::❌ Migration failed"
            cat /tmp/migrate.txt
            exit $CODE
          fi
          if grep -q "Applying migration" /tmp/migrate.txt; then
            echo "applied=true" >> $GITHUB_OUTPUT
            echo "✅ Migrations applied"
          else
            echo "applied=false" >> $GITHUB_OUTPUT
            echo "✅ DB up to date — no pending migrations"
          fi
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      - name: Verify no drift
        run: |
          supabase db push --linked --dry-run 2>&1 | tee /tmp/drift.txt || true
          if grep -q "Applying migration" /tmp/drift.txt; then
            echo "::error::❌ Drift detected after migration — check Supabase logs"
            exit 1
          fi
          echo "✅ No drift"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

  # ══════════════════════════════════════════════════════════════════════════
  # BUILD PLATFORM — Docker image (parallel with orchestrator + migrate)
  # ══════════════════════════════════════════════════════════════════════════
  build-platform:
    name: 🏗️ Build Platform
    runs-on: ubuntu-latest
    needs: [detect, preflight]
    timeout-minutes: 30
    if: |
      always() &&
      needs.detect.outputs.deploy_platform == 'true' &&
      (needs.preflight.result == 'success' || needs.preflight.result == 'skipped') &&
      needs.preflight.result != 'failure'
    outputs:
      image-uri: ${{ steps.meta.outputs.image-uri }}
      previous-digest: ${{ steps.prev.outputs.digest }}
      cache-hit: ${{ steps.build.outputs.cache-hit }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      # Capture current :latest digest for instant rollback
      - name: Capture rollback target
        id: prev
        run: |
          DIGEST=$(aws ecr describe-images \
            --repository-name ${{ env.PLATFORM_ECR }} \
            --image-ids imageTag=latest \
            --query 'imageDetails[0].imageDigest' \
            --output text 2>/dev/null || echo "none")
          echo "digest=$DIGEST" >> $GITHUB_OUTPUT
          echo "📸 Rollback target: $DIGEST"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: |
            image=moby/buildkit:latest
            network=host

      - name: Build & push platform image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./platform/Dockerfile
          push: true
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ env.PLATFORM_ECR }}:latest
            ${{ steps.ecr.outputs.registry }}/${{ env.PLATFORM_ECR }}:${{ github.sha }}
            ${{ steps.ecr.outputs.registry }}/${{ env.PLATFORM_ECR }}:deploy-${{ github.run_number }}
          build-args: |
            NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          # Triple-layer cache: GHA cache + ECR registry cache + inline
          cache-from: |
            type=gha,scope=platform
            type=registry,ref=${{ steps.ecr.outputs.registry }}/${{ env.PLATFORM_ECR }}:buildcache
          cache-to: |
            type=gha,mode=max,scope=platform
            type=registry,ref=${{ steps.ecr.outputs.registry }}/${{ env.PLATFORM_ECR }}:buildcache,mode=max,image-manifest=true
          platforms: linux/amd64
          provenance: false  # smaller image, faster push

      - name: Output metadata
        id: meta
        run: |
          URI="${{ steps.ecr.outputs.registry }}/${{ env.PLATFORM_ECR }}:${{ github.sha }}"
          echo "image-uri=$URI" >> $GITHUB_OUTPUT
          echo "🖼️  Platform image: $URI"

  # ══════════════════════════════════════════════════════════════════════════
  # BUILD ORCHESTRATOR — Docker image (parallel with platform + migrate)
  # ══════════════════════════════════════════════════════════════════════════
  build-orchestrator:
    name: 🏗️ Build Orchestrator
    runs-on: ubuntu-latest
    needs: [detect, preflight]
    timeout-minutes: 30
    if: |
      always() &&
      needs.detect.outputs.deploy_orchestrator == 'true' &&
      (needs.preflight.result == 'success' || needs.preflight.result == 'skipped') &&
      needs.preflight.result != 'failure'
    outputs:
      image-uri: ${{ steps.meta.outputs.image-uri }}
      previous-digest: ${{ steps.prev.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Capture rollback target
        id: prev
        run: |
          DIGEST=$(aws ecr describe-images \
            --repository-name ${{ env.ORCHESTRATOR_ECR }} \
            --image-ids imageTag=latest \
            --query 'imageDetails[0].imageDigest' \
            --output text 2>/dev/null || echo "none")
          echo "digest=$DIGEST" >> $GITHUB_OUTPUT
          echo "📸 Rollback target: $DIGEST"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: |
            image=moby/buildkit:latest
            network=host

      - name: Build & push orchestrator image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ env.ORCHESTRATOR_ECR }}:latest
            ${{ steps.ecr.outputs.registry }}/${{ env.ORCHESTRATOR_ECR }}:${{ github.sha }}
            ${{ steps.ecr.outputs.registry }}/${{ env.ORCHESTRATOR_ECR }}:deploy-${{ github.run_number }}
          cache-from: |
            type=gha,scope=orchestrator
            type=registry,ref=${{ steps.ecr.outputs.registry }}/${{ env.ORCHESTRATOR_ECR }}:buildcache
          cache-to: |
            type=gha,mode=max,scope=orchestrator
            type=registry,ref=${{ steps.ecr.outputs.registry }}/${{ env.ORCHESTRATOR_ECR }}:buildcache,mode=max,image-manifest=true
          platforms: linux/amd64
          provenance: false

      - name: Output metadata
        id: meta
        run: |
          URI="${{ steps.ecr.outputs.registry }}/${{ env.ORCHESTRATOR_ECR }}:${{ github.sha }}"
          echo "image-uri=$URI" >> $GITHUB_OUTPUT
          echo "🖼️  Orchestrator image: $URI"

  # ══════════════════════════════════════════════════════════════════════════
  # DEPLOY — ECS rolling deploy with instant rollback on failure
  # Hard gates: all required jobs must have succeeded (not just "not failed")
  # ══════════════════════════════════════════════════════════════════════════
  deploy:
    name: 🚢 Deploy → ${{ needs.detect.outputs.deploy_label }}
    runs-on: ubuntu-latest
    needs: [detect, preflight, migrate, build-platform, build-orchestrator]
    environment: production
    env:
      PLATFORM_URL: ${{ vars.PLATFORM_URL }}
    if: |
      always() &&
      (needs.detect.outputs.deploy_platform == 'true' || needs.detect.outputs.deploy_orchestrator == 'true') &&
      needs.preflight.result != 'failure' &&
      needs.migrate.result != 'failure' &&
      needs.build-platform.result != 'failure' &&
      needs.build-orchestrator.result != 'failure' &&
      (needs.build-platform.result == 'success' || needs.build-platform.result == 'skipped') &&
      (needs.build-orchestrator.result == 'success' || needs.build-orchestrator.result == 'skipped')

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # ── Announce deploy ─────────────────────────────────────────────────
      - name: 📣 Deploy starting
        run: |
          echo "## 🚀 Deploying: ${{ needs.detect.outputs.deploy_label }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| | |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| **Commit** | [\`${GITHUB_SHA:0:7}\`](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}) |" >> $GITHUB_STEP_SUMMARY
          echo "| **By** | ${{ github.actor }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Run** | [#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) |" >> $GITHUB_STEP_SUMMARY
          echo "| **Triggered by** | ${{ github.event_name }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

      # ── Deploy Platform ─────────────────────────────────────────────────
      - name: 🚀 Deploy platform to ECS
        id: deploy-platform
        if: needs.detect.outputs.deploy_platform == 'true'
        run: |
          echo "Deploying platform → ECS..."
          # minimumHealthyPercent=0: stop old task before starting new
          #   (Fargate vCPU quota is tight; rolling would exceed quota)
          # maximumPercent=200: required when AZ Rebalancing is ENABLED
          #   (setting ≤100 throws InvalidParameterException)
          aws ecs update-service \
            --cluster ${{ env.ECS_CLUSTER }} \
            --service ${{ env.PLATFORM_SERVICE }} \
            --force-new-deployment \
            --deployment-configuration minimumHealthyPercent=0,maximumPercent=200 \
            --region ${{ env.AWS_REGION }} \
            --output json | jq -r '"  Service: \(.service.serviceName) | Status: \(.service.status) | Running: \(.service.runningCount)/\(.service.desiredCount)"'
          echo "✅ ECS accepted platform deploy"

      # Custom poller — replaces `aws ecs wait services-stable` which:
      #   • Hard-caps at 10 min (40 polls × 15s) → exit 255
      #   • Zero progress feedback
      #   • Can't detect crash-loops vs slow-start
      - name: ⏳ Wait for platform stability
        if: needs.detect.outputs.deploy_platform == 'true'
        run: |
          echo "Polling ECS (up to 15 min)..."
          MAX=60        # 60 × 15s = 15 min max
          INTERVAL=15
          NEED=2        # 2 consecutive stable reads = confirmed stable
          stable=0

          for i in $(seq 1 $MAX); do
            OUT=$(aws ecs describe-services \
              --cluster ${{ env.ECS_CLUSTER }} \
              --services ${{ env.PLATFORM_SERVICE }} \
              --region ${{ env.AWS_REGION }} \
              --query 'services[0].deployments[?status==`PRIMARY`].[runningCount,desiredCount,rolloutState]' \
              --output text 2>&1)

            RUN=$(echo "$OUT" | awk '{print $1}')
            DES=$(echo "$OUT" | awk '{print $2}')
            STATE=$(echo "$OUT" | awk '{print $3}')
            PCT=$([ "$DES" -gt 0 ] 2>/dev/null && echo "$((RUN * 100 / DES))%" || echo "?%")

            echo "  [$(date -u +%H:%M:%S)] poll $i/$MAX — $RUN/$DES tasks ($PCT) — $STATE"

            if [ "$STATE" = "FAILED" ]; then
              echo "::error::💥 ECS deployment FAILED — tasks are crash-looping"
              echo "::error::→ CloudWatch: /ecs/nexusbrain-training (platform)"
              echo "::error::→ Rollback: ${{ needs.build-platform.outputs.previous-digest }}"
              exit 1
            fi

            if [ "$STATE" = "COMPLETED" ] && [ "$RUN" = "$DES" ] && [ "${RUN:-0}" -gt 0 ]; then
              stable=$((stable + 1))
              echo "  ✓ Stable reading $stable/$NEED"
              if [ "$stable" -ge "$NEED" ]; then
                echo "✅ Platform stable — $RUN/$DES tasks running"
                break
              fi
            else
              stable=0
            fi

            [ "$i" -eq "$MAX" ] && {
              echo "::error::⏱️  Timed out after $((MAX * INTERVAL))s — last: $RUN/$DES $STATE"
              exit 1
            }

            sleep $INTERVAL
          done

      # ── Deploy Orchestrator ─────────────────────────────────────────────
      - name: 🚀 Deploy orchestrator to ECS
        id: deploy-orchestrator
        if: needs.detect.outputs.deploy_orchestrator == 'true'
        run: |
          echo "Deploying orchestrator → ECS..."
          if aws ecs update-service \
            --cluster ${{ env.ECS_CLUSTER }} \
            --service ${{ env.ORCHESTRATOR_SERVICE }} \
            --force-new-deployment \
            --deployment-configuration minimumHealthyPercent=0,maximumPercent=200 \
            --region ${{ env.AWS_REGION }} \
            --output json 2>&1 | jq -r '"  Service: \(.service.serviceName) | Status: \(.service.status)"' 2>/dev/null; then
            echo "✅ Orchestrator deploy accepted"
          else
            echo "::warning::⚠️ Orchestrator ECS service '${{ env.ORCHESTRATOR_SERVICE }}' not found as persistent service."
            echo "::warning::Scheduled tasks will pick up :latest on next scheduled run — platform unaffected."
          fi

      # ── Health check ─────────────────────────────────────────────────────
      - name: 🏥 Health check — /api/health
        if: needs.detect.outputs.deploy_platform == 'true' && vars.PLATFORM_URL != ''
        run: |
          HEALTH="${PLATFORM_URL%/}/api/health"
          echo "Polling $HEALTH ..."
          # Exponential backoff: 5s, 10s, 15s, 20s, ... up to 30s intervals
          for i in $(seq 1 15); do
            DELAY=$((i < 6 ? i * 5 : 30))
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "$HEALTH" 2>/dev/null || echo "000")
            if [ "$STATUS" = "200" ]; then
              BODY=$(curl -s --max-time 10 "$HEALTH" 2>/dev/null || echo '{}')
              DB_STATUS=$(echo "$BODY" | python3 -c "import sys,json; print(json.load(sys.stdin).get('status','?'))" 2>/dev/null || echo "?")
              echo "✅ Health check passed (attempt $i) — HTTP 200 — DB: $DB_STATUS"
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "### 🏥 Health Check" >> $GITHUB_STEP_SUMMARY
              echo "| Endpoint | Status | DB |" >> $GITHUB_STEP_SUMMARY
              echo "|----------|--------|----|" >> $GITHUB_STEP_SUMMARY
              echo "| [\`/api/health\`]($HEALTH) | ✅ 200 | \`$DB_STATUS\` |" >> $GITHUB_STEP_SUMMARY
              exit 0
            fi
            echo "  attempt $i — HTTP $STATUS — retrying in ${DELAY}s..."
            sleep $DELAY
          done
          echo "::warning::⚠️ Health check didn't return 200 within timeout — ECS confirmed stable; app may still be warming up."

      # ── Final summary ─────────────────────────────────────────────────────
      - name: 📋 Deployment summary
        if: always()
        run: |
          PLATFORM_RESULT="${{ steps.deploy-platform.outcome }}"
          ORCH_RESULT="${{ steps.deploy-orchestrator.outcome }}"

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📦 Deployed Images" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${{ needs.detect.outputs.deploy_platform }}" = "true" ]; then
            ICON=$([ "$PLATFORM_RESULT" = "success" ] && echo "✅" || echo "❌")
            echo "- $ICON **Platform** → \`${{ env.PLATFORM_ECR }}:${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          fi
          if [ "${{ needs.detect.outputs.deploy_orchestrator }}" = "true" ]; then
            ICON=$([ "$ORCH_RESULT" = "success" ] || [ "$ORCH_RESULT" = "skipped" ] && echo "✅" || echo "❌")
            echo "- $ICON **Orchestrator** → \`${{ env.ORCHESTRATOR_ECR }}:${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### ↩️ Instant Rollback" >> $GITHUB_STEP_SUMMARY
          echo "If something looks wrong, rollback in ~30s:" >> $GITHUB_STEP_SUMMARY
          echo '```bash' >> $GITHUB_STEP_SUMMARY
          if [ "${{ needs.detect.outputs.deploy_platform }}" = "true" ]; then
            echo "# Re-tag previous platform image as :latest" >> $GITHUB_STEP_SUMMARY
            echo "PREV=\"${{ needs.build-platform.outputs.previous-digest }}\"" >> $GITHUB_STEP_SUMMARY
            echo "aws ecr batch-get-image --repository-name ${{ env.PLATFORM_ECR }} --image-ids imageDigest=\$PREV --query 'images[0].imageManifest' --output text | \\" >> $GITHUB_STEP_SUMMARY
            echo "  aws ecr put-image --repository-name ${{ env.PLATFORM_ECR }} --image-tag latest --image-manifest file:///dev/stdin" >> $GITHUB_STEP_SUMMARY
            echo "aws ecs update-service --cluster ${{ env.ECS_CLUSTER }} --service ${{ env.PLATFORM_SERVICE }} --force-new-deployment --deployment-configuration minimumHealthyPercent=0,maximumPercent=200" >> $GITHUB_STEP_SUMMARY
          fi
          echo '```' >> $GITHUB_STEP_SUMMARY

  # ══════════════════════════════════════════════════════════════════════════
  # NOTIFY — Slack / GitHub deployment status
  # ══════════════════════════════════════════════════════════════════════════
  notify:
    name: 📬 Notify
    runs-on: ubuntu-latest
    needs: [detect, deploy]
    if: always() && (needs.detect.outputs.deploy_platform == 'true' || needs.detect.outputs.deploy_orchestrator == 'true')
    steps:
      - name: Slack notification
        if: secrets.SLACK_WEBHOOK_URL != ''
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          STATUS="${{ needs.deploy.result }}"
          if [ "$STATUS" = "success" ]; then
            ICON="✅"; COLOR="#36a64f"; MSG="Deploy succeeded"
          else
            ICON="❌"; COLOR="#cc0000"; MSG="Deploy FAILED"
          fi

          SHORT_SHA="${GITHUB_SHA:0:7}"
          LABEL="${{ needs.detect.outputs.deploy_label }}"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          curl -s -X POST "$SLACK_WEBHOOK_URL" \
            -H 'Content-Type: application/json' \
            -d "{
              \"attachments\": [{
                \"color\": \"$COLOR\",
                \"blocks\": [
                  {
                    \"type\": \"section\",
                    \"text\": {
                      \"type\": \"mrkdwn\",
                      \"text\": \"$ICON *NexusBrain — $MSG*\n*Target:* $LABEL\n*Commit:* \`$SHORT_SHA\`\n*By:* ${{ github.actor }}\n*<$RUN_URL|View run →>*\"
                    }
                  }
                ]
              }]
            }"
