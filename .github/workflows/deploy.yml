name: Deploy CausalRiver Worker

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'main.py'
      - 'requirements.txt'
      - 'Dockerfile'
      - '.github/workflows/deploy.yml'

  workflow_dispatch:
    inputs:
      skip_build:
        description: 'Skip Docker build (just redeploy ECS from existing ECR image)'
        required: false
        default: false
        type: boolean

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: 848269696611.dkr.ecr.us-east-1.amazonaws.com
  ECR_REPO: causalriver-worker
  PUBLIC_ECR_REGISTRY: public.ecr.aws/d9m7h3k5
  PUBLIC_ECR_REPO: causalriver-worker
  ECS_CLUSTER: agentbeats-cluster
  ECS_SERVICE: causalriver-worker
  ECS_TASK_DEF: causalriver-worker:1

permissions:
  id-token: write
  contents: read

jobs:
  # ─────────────────────────────────────────────
  # JOB 1: Build + push Docker image
  # ─────────────────────────────────────────────
  build:
    name: Build + Push Image
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.skip_build != 'true' }}
    outputs:
      image_digest: ${{ steps.push.outputs.digest }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::848269696611:role/agentbeats-github-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to private ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Login to public ECR
        run: |
          aws ecr-public get-login-password --region us-east-1 \
            | docker login --username AWS --password-stdin public.ecr.aws

      - name: Build Docker image
        run: |
          docker build \
            --tag ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPO }}:${{ github.sha }} \
            --tag ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPO }}:latest \
            --tag ${{ env.PUBLIC_ECR_REGISTRY }}/${{ env.PUBLIC_ECR_REPO }}:latest \
            .

      - name: Push to private ECR
        id: push
        run: |
          docker push ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPO }}:${{ github.sha }}
          docker push ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPO }}:latest
          DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' \
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPO }}:latest | cut -d@ -f2)
          echo "digest=$DIGEST" >> $GITHUB_OUTPUT

      - name: Push to public ECR
        run: |
          docker push ${{ env.PUBLIC_ECR_REGISTRY }}/${{ env.PUBLIC_ECR_REPO }}:latest

  # ─────────────────────────────────────────────
  # JOB 2: Deploy to ECS
  # ─────────────────────────────────────────────
  deploy:
    name: Deploy to ECS
    runs-on: ubuntu-latest
    needs: [build]
    if: always() && !failure()

    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::848269696611:role/agentbeats-github-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Force ECS redeploy
        run: |
          aws ecs update-service \
            --cluster ${{ env.ECS_CLUSTER }} \
            --service ${{ env.ECS_SERVICE }} \
            --force-new-deployment \
            --region ${{ env.AWS_REGION }}

      - name: Wait for ECS stability
        run: |
          aws ecs wait services-stable \
            --cluster ${{ env.ECS_CLUSTER }} \
            --services ${{ env.ECS_SERVICE }} \
            --region ${{ env.AWS_REGION }}
        timeout-minutes: 10
