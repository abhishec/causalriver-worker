name: Brain Consolidation (Nightly Sleep)

# ============================================================================
# AUTOMATED BRAIN SLEEP CYCLE
# ============================================================================
#
# Gap #1 Fix: The brain has a full 10-step consolidation runner but no
# automated scheduling. Without this, the brain never "sleeps" unless
# manually triggered. This workflow ensures the brain consolidates
# knowledge nightly — pruning weak edges, strengthening validated ones,
# AND running the full brain pipeline including cognitive stack L3-L15
# (Deep Dreaming, Curiosity, Self-Modifying Cognition, Intelligence Mesh,
# Causal Imagination, Theory of Mind, Temporal Consciousness, Red Team,
# Experimentation, Immune System, Goal Planning, Narrative Intelligence),
# then generating executive briefings.
#
# Architecture:
#   Job 1: Typecheck — fast tsc --noEmit to catch type errors before runtime
#   Job 2: Consolidation — tsx runs scripts from source (no dist/ build needed)
#
# Schedule: Nightly at 2 AM UTC (matches brain-consolidation agent schedule)
# Fallback: Manual trigger via workflow_dispatch
# ============================================================================

on:
  # Nightly at 2 AM UTC
  schedule:
    - cron: '0 2 * * *'

  # Manual trigger with options
  workflow_dispatch:
    inputs:
      consolidate_all_orgs:
        description: 'Consolidate all active organizations'
        required: false
        type: boolean
        default: true
      verbose:
        description: 'Enable verbose logging'
        required: false
        type: boolean
        default: true
      lookback_hours:
        description: 'Hours to look back for signals (default: 48)'
        required: false
        type: string
        default: '48'

# Workflow-level permissions — required for scheduled events where
# job-level permissions alone don't elevate the GITHUB_TOKEN.
permissions:
  contents: read
  issues: write  # Required for failure notification (actions/github-script)

jobs:
  # ──────────────────────────────────────────────────────────────────────
  # Job 1: Typecheck — fast gate to catch type errors before expensive run
  # ──────────────────────────────────────────────────────────────────────
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Typecheck memory-stack
        run: pnpm --filter @nexus-ai/memory-stack run typecheck

  # ──────────────────────────────────────────────────────────────────────
  # Job 2: Brain Sleep Cycle — the actual consolidation pipeline
  # NOTE: No "Build memory-stack" step. Nightly scripts import from src/
  # via tsx, not from dist/. The old tsup build was flaky (DTS worker race)
  # and unnecessary — typecheck above validates types without artifacts.
  # ──────────────────────────────────────────────────────────────────────
  consolidation:
    name: Brain Sleep Cycle
    needs: typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 120  # 2-hour max (large orgs with 10M signals)

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Validate required secrets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          # Fall back to NEXT_PUBLIC_SUPABASE_URL if SUPABASE_URL is not set
          if [ -z "$SUPABASE_URL" ] && [ -n "$NEXT_PUBLIC_SUPABASE_URL" ]; then
            export SUPABASE_URL="$NEXT_PUBLIC_SUPABASE_URL"
          fi

          missing=0
          if [ -z "$SUPABASE_URL" ]; then
            echo "::error::SUPABASE_URL (or NEXT_PUBLIC_SUPABASE_URL) not configured."
            echo "  → Go to Settings > Secrets and variables > Actions"
            missing=1
          fi
          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::error::SUPABASE_SERVICE_ROLE_KEY not configured."
            echo "  → Go to Settings > Secrets and variables > Actions"
            missing=1
          fi
          if [ $missing -gt 0 ]; then
            exit 1
          fi
          echo "✅ All required secrets are configured."

      - name: Run All Nightly Agents
        # Nightly agents may hit transient errors (DB timeouts, API rate limits).
        # continue-on-error prevents creating false-alarm issues + email noise.
        # The "Notify on Failure" step below still checks step conclusion for
        # persistent failures that need attention.
        continue-on-error: true
        id: nightly
        env:
          NODE_OPTIONS: '--max-old-space-size=4096 --expose-gc'
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          CONSOLIDATE_ALL_ORGS: ${{ github.event.inputs.consolidate_all_orgs || 'true' }}
          VERBOSE: ${{ github.event.inputs.verbose || 'true' }}
          LOOKBACK_HOURS: ${{ github.event.inputs.lookback_hours || '48' }}
          CONSOLIDATION_MODE: 'once'
          PRUNE_AFTER_DAYS: '30'
          MAX_CONSOLIDATION_SIGNALS: '50000'
        run: |
          # Fall back to NEXT_PUBLIC_SUPABASE_URL if SUPABASE_URL is not set
          if [ -z "$SUPABASE_URL" ] && [ -n "$NEXT_PUBLIC_SUPABASE_URL" ]; then
            export SUPABASE_URL="$NEXT_PUBLIC_SUPABASE_URL"
          fi

          echo "=== NexusBrain Nightly — All Agents, All Customers, All Orgs ==="
          echo "Time: $(date -u)"
          echo "Phases: Edge Jobs → Consolidation → Oracle RL → Full Pipeline"
          echo "Signal cap: $MAX_CONSOLIDATION_SIGNALS (env-configurable)"
          echo ""

          pnpm exec tsx scripts/run-all-nightly.ts

      - name: Report Nightly Status
        if: always()
        run: |
          if [ "${{ steps.nightly.outcome }}" = "failure" ]; then
            echo "::warning::Nightly consolidation had failures. Check logs for per-org details."
          elif [ "${{ steps.nightly.outcome }}" = "success" ]; then
            echo "✅ Nightly consolidation completed successfully."
          else
            echo "::notice::Nightly consolidation status: ${{ steps.nightly.outcome }}"
          fi

      - name: Upload Consolidation Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: brain-consolidation-${{ github.run_number }}
          path: |
            consolidation-report-*.json
            brain-health-*.json
          retention-days: 30
          if-no-files-found: ignore

      - name: Notify on Failure
        # Uses step conclusion (not failure()) since nightly step has continue-on-error.
        # Only creates issue on scheduled runs — manual triggers don't need auto-issues.
        if: steps.nightly.conclusion == 'failure' && github.event_name == 'schedule'
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'Nightly Brain Agents Failed';
            const body = `
            ## Nightly Brain Agents Failed

            The nightly all-agents run failed. One or more phases did not complete.

            **Run:** [View Details](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
            **Time:** ${new Date().toISOString()}

            ### Phases
            1. Edge Function daily jobs (verification, weights, decay, thresholds, retention)
            2. Brain Consolidation (10-step sleep + cognitive stack L3-L15)
            3. Oracle RL (prediction verification + UCB1 bandit updates)
            4. Full Brain Pipeline per org (cognitive stack L3-L15 per org)

            ### Next Steps
            1. Check the [workflow logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
            2. Verify Supabase connectivity
            3. Run manually: \`pnpm run nightly\`

            _Automated alert from Brain Orchestrator._
            `;

            // Check if issue already exists
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'brain-health,automated'
            });

            const existingIssue = issues.data.find(issue => issue.title === title);

            if (!existingIssue) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['brain-health', 'automated', 'consolidation']
              });
            }
