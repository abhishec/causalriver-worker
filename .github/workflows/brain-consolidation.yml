name: Brain Consolidation (Nightly Sleep)

# ============================================================================
# AUTOMATED BRAIN SLEEP CYCLE
# ============================================================================
#
# Gap #1 Fix: The brain has a full 10-step consolidation runner but no
# automated scheduling. Without this, the brain never "sleeps" unless
# manually triggered. This workflow ensures the brain consolidates
# knowledge nightly — pruning weak edges, strengthening validated ones,
# AND running the full brain pipeline including cognitive stack L3-L15
# (Deep Dreaming, Curiosity, Self-Modifying Cognition, Intelligence Mesh,
# Causal Imagination, Theory of Mind, Temporal Consciousness, Red Team,
# Experimentation, Immune System, Goal Planning, Narrative Intelligence),
# then generating executive briefings.
#
# Architecture:
#   GitHub Actions (scheduler) → brain-consolidation-runner.ts (Node.js)
#   - Runs outside Deno/Edge Functions (needs Node.js modules)
#   - Consolidates all active orgs, then core brain
#   - Generates daily brain snapshot for website dashboard
#   - Produces executive briefing via LLM amplifier
#
# Schedule: Nightly at 2 AM UTC (matches brain-consolidation agent schedule)
# Fallback: Manual trigger via workflow_dispatch
# ============================================================================

on:
  # Nightly at 2 AM UTC
  schedule:
    - cron: '0 2 * * *'

  # Manual trigger with options
  workflow_dispatch:
    inputs:
      consolidate_all_orgs:
        description: 'Consolidate all active organizations'
        required: false
        type: boolean
        default: true
      verbose:
        description: 'Enable verbose logging'
        required: false
        type: boolean
        default: true
      lookback_hours:
        description: 'Hours to look back for signals (default: 48)'
        required: false
        type: string
        default: '48'

# Workflow-level permissions — required for scheduled events where
# job-level permissions alone don't elevate the GITHUB_TOKEN.
permissions:
  contents: read
  issues: write  # Required for failure notification (actions/github-script)

jobs:
  consolidation:
    name: Brain Sleep Cycle
    runs-on: ubuntu-latest
    timeout-minutes: 120  # 2-hour max (large orgs with 10M signals)

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Build memory-stack
        run: pnpm --filter @nexus-ai/memory-stack run build

      - name: Run All Nightly Agents
        env:
          NODE_OPTIONS: '--max-old-space-size=4096 --expose-gc'
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          CONSOLIDATE_ALL_ORGS: ${{ github.event.inputs.consolidate_all_orgs || 'true' }}
          VERBOSE: ${{ github.event.inputs.verbose || 'true' }}
          LOOKBACK_HOURS: ${{ github.event.inputs.lookback_hours || '48' }}
          CONSOLIDATION_MODE: 'once'
          PRUNE_AFTER_DAYS: '30'
        run: |
          # Fall back to NEXT_PUBLIC_SUPABASE_URL if SUPABASE_URL is not set
          if [ -z "$SUPABASE_URL" ] && [ -n "$NEXT_PUBLIC_SUPABASE_URL" ]; then
            export SUPABASE_URL="$NEXT_PUBLIC_SUPABASE_URL"
          fi

          # Validate required secrets
          if [ -z "$SUPABASE_URL" ]; then
            echo "::error::SUPABASE_URL (or NEXT_PUBLIC_SUPABASE_URL) must be configured in repository secrets."
            exit 1
          fi
          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::error::SUPABASE_SERVICE_ROLE_KEY must be configured in repository secrets."
            echo ""
            echo "To configure:"
            echo "  1. Go to Settings > Secrets and variables > Actions"
            echo "  2. Add SUPABASE_SERVICE_ROLE_KEY"
            exit 1
          fi

          echo "=== NexusBrain Nightly — All Agents, All Customers, All Orgs ==="
          echo "Time: $(date -u)"
          echo "Phases: Edge Jobs → Consolidation → Oracle RL → Full Pipeline"
          echo ""

          pnpm exec tsx scripts/run-all-nightly.ts

      - name: Upload Consolidation Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: brain-consolidation-${{ github.run_number }}
          path: |
            consolidation-report-*.json
            brain-health-*.json
          retention-days: 30
          if-no-files-found: ignore

      - name: Notify on Failure
        if: failure() && github.event_name == 'schedule'
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'Nightly Brain Agents Failed';
            const body = `
            ## Nightly Brain Agents Failed

            The nightly all-agents run failed. One or more phases did not complete.

            **Run:** [View Details](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
            **Time:** ${new Date().toISOString()}

            ### Phases
            1. Edge Function daily jobs (verification, weights, decay, thresholds, retention)
            2. Brain Consolidation (10-step sleep + cognitive stack L3-L15)
            3. Oracle RL (prediction verification + UCB1 bandit updates)
            4. Full Brain Pipeline per org (cognitive stack L3-L15 per org)

            ### Next Steps
            1. Check the [workflow logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
            2. Verify Supabase connectivity
            3. Run manually: \`pnpm run nightly\`

            _Automated alert from Brain Orchestrator._
            `;

            // Check if issue already exists
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'brain-health,automated'
            });

            const existingIssue = issues.data.find(issue => issue.title === title);

            if (!existingIssue) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['brain-health', 'automated', 'consolidation']
              });
            }
