name: Deploy to AWS Production

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'What to deploy'
        required: true
        default: 'orchestrator'
        type: choice
        options:
          - orchestrator
          - all-tasks

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: nexusbrain-trainer
  ECS_CLUSTER: nexusbrain-training
  CONTAINER_NAME: brain-orchestrator

jobs:
  # ---------------------------------------------------------------
  # Pre-Deployment Validation
  # ---------------------------------------------------------------
  validate:
    name: Pre-Deployment Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

      - name: Build memory-stack
        run: pnpm --filter @nexus-ai/memory-stack run build

      - name: Security audit
        run: pnpm audit --audit-level=high || true

  # ---------------------------------------------------------------
  # Build and Push Docker Image
  # ---------------------------------------------------------------
  build:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: validate
    outputs:
      image-uri: ${{ steps.build-image.outputs.image-uri }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        id: build-image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

      - name: Output image URI
        run: |
          echo "image-uri=${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}" >> $GITHUB_OUTPUT

  # ---------------------------------------------------------------
  # Force ECS to pull latest image
  # ---------------------------------------------------------------
  deploy:
    name: Deploy to ECS
    runs-on: ubuntu-latest
    needs: build
    environment: production
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Force new deployment on orchestrator service (if exists)
        if: inputs.target == 'orchestrator'
        run: |
          echo "Forcing new deployment of orchestrator service..."
          aws ecs update-service \
            --cluster ${{ env.ECS_CLUSTER }} \
            --service nexusbrain-orchestrator-service \
            --force-new-deployment \
            --region ${{ env.AWS_REGION }} 2>/dev/null || \
          echo "No orchestrator service found — scheduled tasks will pick up :latest on next run"

      - name: Verify image is in ECR
        run: |
          echo "Verifying image in ECR..."
          aws ecr describe-images \
            --repository-name ${{ env.ECR_REPOSITORY }} \
            --image-ids imageTag=latest \
            --query 'imageDetails[0].{pushed: imagePushedAt, size: imageSizeInBytes}' \
            --output table

      - name: Deployment summary
        run: |
          echo "## Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Image:** ${{ env.ECR_REPOSITORY }}:latest (${{ github.sha }})" >> $GITHUB_STEP_SUMMARY
          echo "- **Cluster:** ${{ env.ECS_CLUSTER }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Target:** ${{ inputs.target }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Region:** ${{ env.AWS_REGION }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Author:** ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "All 15 ECS task definitions reference \`:latest\` — they will" >> $GITHUB_STEP_SUMMARY
          echo "automatically pick up this image on their next EventBridge run." >> $GITHUB_STEP_SUMMARY

  # ---------------------------------------------------------------
  # Notification
  # ---------------------------------------------------------------
  notify:
    name: Notify
    runs-on: ubuntu-latest
    needs: [build, deploy]
    if: always()
    steps:
      - name: Send Slack notification (if configured)
        if: env.SLACK_WEBHOOK_URL != ''
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          STATUS=${{ needs.deploy.result == 'success' && 'SUCCESS' || 'FAILED' }}
          curl -s -X POST "$SLACK_WEBHOOK_URL" \
            -H 'Content-Type: application/json' \
            -d "{\"text\": \"NexusBrain Deploy: ${STATUS} | Commit: ${{ github.sha }} | By: ${{ github.actor }}\"}"
