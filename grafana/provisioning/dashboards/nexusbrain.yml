# Grafana Dashboard Provisioning for NexusBrain Observability
# Auto-loads dashboards from the dashboards/ directory

apiVersion: 1

providers:
  - name: 'NexusBrain Observability'
    orgId: 1
    folder: 'NexusBrain'
    folderUid: 'nexusbrain'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /etc/grafana/dashboards
      foldersFromFilesStructure: false
