version: 1
applications:
  - appRoot: platform
    frontend:
      phases:
        preBuild:
          commands:
            - npm install -g pnpm@9
            # Pin memory limit for all Node processes (Amplify Standard = ~7 GB RAM)
            # 3584 MB = 3.5 GB — leaves headroom for OS + pnpm overhead
            # If exit 137 (OOM kill) appears, upgrade to computeType LARGE or reduce limit further
            - export NODE_OPTIONS="--max-old-space-size=3584"
            - pushd .. && NODE_OPTIONS="--max-old-space-size=3584" pnpm install --frozen-lockfile && NODE_OPTIONS="--max-old-space-size=3584" pnpm --filter @nexus-ai/memory-stack run build && popd
        build:
          commands:
            - NODE_OPTIONS="--max-old-space-size=3584" pnpm exec tsc --noEmit
            - pnpm build
      artifacts:
        baseDirectory: .next
        files:
          - '**/*'
      cache:
        paths:
          - .next/cache/**/*
          - node_modules/**/*
          - ../node_modules/**/*
          - ../packages/memory-stack/dist/**/*
