version: 1
applications:
  - appRoot: platform
    frontend:
      phases:
        preBuild:
          commands:
            - npm install
        build:
          commands:
            - npx next build
      artifacts:
        baseDirectory: .
        files:
          - '**/*'
      cache:
        paths:
          - .next/cache/**/*
          - node_modules/**/*
