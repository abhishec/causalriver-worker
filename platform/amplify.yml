version: 1
applications:
  - appRoot: platform
    frontend:
      phases:
        preBuild:
          commands:
            - npm install -g pnpm@9
            - pushd .. && pnpm install --frozen-lockfile && pnpm --filter @nexus-ai/memory-stack run build && popd
        build:
          commands:
            - pnpm exec tsc --noEmit
            - pnpm build
      artifacts:
        baseDirectory: .next
        files:
          - '**/*'
      cache:
        paths:
          - .next/cache/**/*
          - node_modules/**/*
          - ../node_modules/**/*
          - ../packages/memory-stack/dist/**/*
