version: 1
applications:
  - appRoot: platform
    frontend:
      buildPath: /
      phases:
        preBuild:
          commands:
            - npm install -g pnpm@9
            - pnpm install
        build:
          commands:
            - cd platform && pnpm build
      artifacts:
        baseDirectory: platform/.next
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*
          - platform/node_modules/**/*
          - platform/.next/cache/**/*
