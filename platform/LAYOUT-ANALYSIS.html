<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brain OS Copilot — Interactive Prototype</title>
<style>
/* ══════════════════════════════════════════════════════════
   CLAUDE UI EXACT COLOR PALETTE
   bg-100: #faf9f5  (main bg — warm cream)
   bg-200: #f5f4ed  (sidebar bg)
   bg-300: #f0eee6  (hover state)
   bg-400: #e8e6dc  (active/pressed)
   text-100: #141413 (primary — near black)
   text-200: #3d3d3a (secondary)
   text-400: #73726c (muted)
   border: rgba(31,30,29,0.15)
   accent: #c6613f  (terracotta orange)
   accent-blue: #2c84db
   input-box: #fff, radius 20px, shadow
   ══════════════════════════════════════════════════════════ */
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Söhne',ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#faf9f5;color:#141413;overflow:hidden;height:100vh}

/* Service bar */
.svc-bar{height:44px;display:flex;align-items:center;justify-content:center;gap:4px;border-bottom:1px solid rgba(31,30,29,.1);background:#faf9f5;flex-shrink:0}
.svc-tab{padding:6px 16px;border-radius:8px;font-size:13px;font-weight:500;color:#73726c;cursor:pointer;border:none;background:none;transition:all .15s}
.svc-tab:hover{color:#3d3d3a;background:rgba(31,30,29,.06)}
.svc-tab.active{color:#141413;background:rgba(31,30,29,.08);font-weight:600}

/* Main 4-col layout */
.main{display:flex;height:calc(100vh - 44px);min-height:0}

/* Col 1: Sidebar */
.sidebar{width:260px;background:#f5f4ed;border-right:1px solid rgba(31,30,29,.1);display:flex;flex-direction:column;flex-shrink:0;overflow:hidden}
.sb-header{padding:16px 16px 12px;display:flex;align-items:center;justify-content:space-between}
.sb-logo{font-size:18px;font-weight:700;color:#141413;letter-spacing:-.3px}
.sb-actions{display:flex;gap:2px}
.sb-btn{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;border:none;background:none;color:#73726c;cursor:pointer;font-size:14px;transition:all .15s}
.sb-btn:hover{background:rgba(31,30,29,.08);color:#3d3d3a}
.sb-nav{padding:0 8px;margin-bottom:8px}
.sb-nav-item{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:8px;font-size:13px;color:#3d3d3a;cursor:pointer;transition:all .12s;font-weight:400}
.sb-nav-item:hover{background:rgba(31,30,29,.06)}
.sb-nav-item.active{background:rgba(31,30,29,.08);font-weight:500;color:#141413}
.sb-nav-item svg{width:16px;height:16px;color:#73726c;flex-shrink:0}
.sb-sep{height:1px;background:rgba(31,30,29,.08);margin:6px 16px}

/* Commands section in sidebar */
.cmd-section{flex:1;overflow:hidden;display:flex;flex-direction:column}
.cmd-section-header{padding:6px 16px;font-size:11px;font-weight:600;color:#73726c;text-transform:uppercase;letter-spacing:.5px}
.cmd-scroll{flex:1;overflow-y:auto;padding:0 8px 8px}
.cmd-scroll::-webkit-scrollbar{width:4px}
.cmd-scroll::-webkit-scrollbar-thumb{background:rgba(31,30,29,.15);border-radius:2px}
.cmd-cat{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.8px;color:#73726c;padding:10px 8px 4px;opacity:.7}
.cmd-item{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:8px;cursor:pointer;transition:all .12s}
.cmd-item:hover{background:rgba(31,30,29,.06)}
.cmd-item.sel{background:rgba(198,97,63,.08);color:#c6613f}
.cmd-emoji{font-size:14px;flex-shrink:0}
.cmd-label{font-size:13px;font-weight:500;color:#141413}
.cmd-item.sel .cmd-label{color:#c6613f}
.cmd-desc{font-size:10px;color:#73726c;margin-top:1px}

/* History */
.hist-section{border-top:1px solid rgba(31,30,29,.08);flex-shrink:0;overflow:hidden;transition:max-height .3s;max-height:36px}
.hist-section.open{max-height:160px}
.hist-toggle{display:flex;align-items:center;justify-content:space-between;padding:8px 16px;cursor:pointer;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;color:#73726c}
.hist-toggle:hover{color:#3d3d3a}
.hist-arrow{transition:transform .2s;font-size:9px}
.hist-section.open .hist-arrow{transform:rotate(180deg)}
.hist-list{padding:0 8px 6px}
.hist-item{display:flex;align-items:center;gap:6px;padding:5px 10px;border-radius:6px;font-size:12px;color:#73726c;cursor:pointer;transition:background .12s}
.hist-item:hover{background:rgba(31,30,29,.06);color:#3d3d3a}

/* Sidebar footer / org */
.sb-footer{padding:10px 12px;border-top:1px solid rgba(31,30,29,.08);display:flex;align-items:center;gap:8px;cursor:pointer;flex-shrink:0}
.sb-footer:hover{background:rgba(31,30,29,.04)}
.sb-avatar{width:28px;height:28px;border-radius:50%;background:#141413;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:#faf9f5;flex-shrink:0}
.sb-footer-name{font-size:12px;font-weight:500;color:#141413}
.sb-footer-sub{font-size:10px;color:#73726c}

/* Col 2: Chat */
.chat-col{flex:1;display:flex;flex-direction:column;background:#faf9f5;min-width:0}
.chat-area{flex:1;overflow-y:auto;padding:24px 0;display:flex;flex-direction:column;gap:0;align-items:center}
.chat-area::-webkit-scrollbar{width:4px}
.chat-area::-webkit-scrollbar-thumb{background:rgba(31,30,29,.15);border-radius:2px}
.chat-inner{max-width:680px;width:100%;padding:0 24px;display:flex;flex-direction:column;gap:4px}
.chat-welcome{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:60px 24px}
.chat-welcome .cw-icon{width:32px;height:32px;margin-bottom:16px}
.chat-welcome .cw-spark{color:#c6613f;font-size:28px}
.chat-welcome h4{font-size:16px;font-weight:500;color:#73726c}

/* Messages */
.msg{max-width:680px;width:100%;padding:0 24px;animation:fadeIn .3s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
.msg-user{padding:12px 0}
.msg-user-text{font-size:15px;color:#141413;line-height:1.6;font-weight:400}
.msg-asst{padding:12px 0}
.msg-asst-text{font-size:15px;color:#3d3d3a;line-height:1.7}
.msg-asst-text strong{color:#141413;font-weight:600}
.msg-art-link{margin-top:8px;display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:8px;background:rgba(198,97,63,.06);border:1px solid rgba(198,97,63,.12);font-size:12px;color:#c6613f;cursor:pointer;transition:all .15s;font-weight:500}
.msg-art-link:hover{background:rgba(198,97,63,.12)}
.new-chat-badge{text-align:center;font-size:11px;color:#73726c;padding:8px 0;display:flex;align-items:center;justify-content:center;gap:4px}
.typing{display:flex;gap:5px;padding:12px 24px}
.typing span{width:7px;height:7px;border-radius:50%;background:#c6613f;opacity:.3;animation:tbounce .6s infinite alternate}
.typing span:nth-child(2){animation-delay:.2s}
.typing span:nth-child(3){animation-delay:.4s}
@keyframes tbounce{to{opacity:1;transform:translateY(-3px)}}

/* Chat input */
.chat-input-area{padding:12px 24px 20px;flex-shrink:0;display:flex;justify-content:center}
.chat-input-box{max-width:680px;width:100%;background:#fff;border-radius:20px;box-shadow:rgba(0,0,0,.035) 0 4px 20px,rgba(31,30,29,.15) 0 0 0 .5px;padding:12px 16px;display:flex;align-items:center;gap:8px}
.chat-input-box input{flex:1;border:none;outline:none;font-size:14px;color:#141413;background:transparent;font-family:inherit}
.chat-input-box input::placeholder{color:#73726c}
.chat-send{width:28px;height:28px;border-radius:50%;background:#141413;border:none;color:#faf9f5;font-size:13px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:opacity .15s}
.chat-send:hover{opacity:.8}

/* Col 3: Artifact panel */
.art-col{width:440px;background:#fff;border-left:1px solid rgba(31,30,29,.1);display:flex;flex-direction:column;flex-shrink:0;overflow:hidden}
.art-empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#73726c}
.art-empty .ae-icon{font-size:24px;margin-bottom:8px;opacity:.4}
.art-empty h4{font-size:14px;font-weight:500;color:#73726c}
.art-empty p{font-size:12px;color:rgba(115,114,108,.6);margin-top:4px}
.art-head{display:flex;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid rgba(31,30,29,.1);flex-shrink:0}
.art-head .a-icon{font-size:16px}
.art-head .a-title{font-size:14px;font-weight:600;flex:1;color:#141413}
.art-head .a-conf{font-size:12px;font-weight:600}
.art-tabs{display:flex;gap:2px;padding:4px 12px;border-bottom:1px solid rgba(31,30,29,.08);flex-shrink:0;overflow-x:auto}
.art-tab{padding:6px 12px;border-radius:6px;font-size:11px;font-weight:500;color:#73726c;cursor:pointer;border:none;background:none;transition:all .15s;white-space:nowrap}
.art-tab:hover{color:#3d3d3a;background:rgba(31,30,29,.06)}
.art-tab.active{color:#141413;background:rgba(31,30,29,.08);font-weight:600}
.art-tab .dot{display:inline-block;width:4px;height:4px;border-radius:50%;margin-left:3px;vertical-align:middle}
.dot.has{background:#22c55e}
.art-body{flex:1;overflow-y:auto;padding:12px 16px}
.art-body::-webkit-scrollbar{width:4px}
.art-body::-webkit-scrollbar-thumb{background:rgba(31,30,29,.15);border-radius:2px}

/* ── Artifact sub-components ── */
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:10px}
.stat-card{background:#faf9f5;border:1px solid rgba(31,30,29,.1);border-radius:10px;padding:10px 12px}
.stat-card .sc-label{font-size:10px;color:#73726c;text-transform:uppercase;letter-spacing:.5px;font-weight:500}
.stat-card .sc-val{font-size:18px;font-weight:700;margin-top:2px}
.insight-box{padding:10px 12px;border-radius:10px;border:1px solid rgba(198,97,63,.15);background:rgba(198,97,63,.04);font-size:12px;color:#c6613f;margin:8px 0;line-height:1.5}
.insight-box strong{font-weight:600}
.finding{display:flex;align-items:flex-start;gap:8px;padding:8px 0;border-bottom:1px solid rgba(31,30,29,.06)}
.finding:last-child{border-bottom:none}
.sev{display:inline-flex;align-items:center;gap:3px;padding:2px 6px;border-radius:4px;font-size:9px;font-weight:700;flex-shrink:0;letter-spacing:.3px}
.sev-crit{background:rgba(220,38,38,.08);color:#dc2626;border:1px solid rgba(220,38,38,.15)}
.sev-high{background:rgba(217,119,6,.08);color:#d97706;border:1px solid rgba(217,119,6,.15)}
.sev-med{background:rgba(202,138,4,.08);color:#ca8a04;border:1px solid rgba(202,138,4,.15)}
.sev-low{background:rgba(37,99,235,.08);color:#2563eb;border:1px solid rgba(37,99,235,.15)}
.finding-text{font-size:13px;color:#3d3d3a;line-height:1.5}
.file-chip{display:inline-flex;align-items:center;gap:3px;padding:2px 6px;border-radius:4px;background:#f5f4ed;border:1px solid rgba(31,30,29,.1);font-size:10px;font-family:'SF Mono',Monaco,monospace;color:#73726c;margin-top:4px}
.branch-pill{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:12px;background:rgba(37,99,235,.06);border:1px solid rgba(37,99,235,.12);font-size:10px;font-family:'SF Mono',Monaco,monospace;color:#2563eb}
.action-item{display:flex;align-items:flex-start;gap:10px;padding:10px;border-radius:10px;border:1px solid rgba(31,30,29,.08);margin-bottom:6px;background:#faf9f5}
.action-pri{width:22px;height:22px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:11px;flex-shrink:0;font-weight:700}
.action-pri.hi{background:rgba(220,38,38,.08);color:#dc2626}
.action-pri.md{background:rgba(217,119,6,.08);color:#d97706}
.action-pri.lo{background:rgba(37,99,235,.08);color:#2563eb}
.score-bar{margin-bottom:8px}
.score-bar-label{display:flex;justify-content:space-between;font-size:11px;margin-bottom:3px}
.score-bar-label span:first-child{color:#73726c}
.score-bar-label span:last-child{font-weight:600}
.score-bar-track{height:6px;background:rgba(31,30,29,.06);border-radius:3px;overflow:hidden}
.score-bar-fill{height:100%;border-radius:3px;transition:width .6s ease}

/* KPI row */
.kpi-row{display:flex;gap:6px;padding:10px 12px;border-bottom:1px solid rgba(31,30,29,.08);flex-shrink:0;overflow-x:auto}
.kpi-card{padding:8px 10px;border-radius:8px;background:#faf9f5;border:1px solid rgba(31,30,29,.08);min-width:0;flex:1}
.kpi-card.accent{border-color:rgba(198,97,63,.2)}
.kpi-label{font-size:9px;color:#73726c;text-transform:uppercase;letter-spacing:.5px;font-weight:500}
.kpi-val{font-size:14px;font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums}
.kpi-sub{font-size:9px;color:#73726c}

/* Financial rows */
.fin-section{padding:5px 12px;background:rgba(31,30,29,.03);border-top:1px solid rgba(31,30,29,.06);border-bottom:1px solid rgba(31,30,29,.06)}
.fin-section span{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.8px;color:#73726c}
.fin-row{display:flex;justify-content:space-between;padding:5px 12px;transition:background .1s}
.fin-row:hover{background:rgba(31,30,29,.03)}
.fin-row .fr-label{font-size:12px;color:#3d3d3a}
.fin-row .fr-label.indent{padding-left:14px}
.fin-row .fr-val{font-size:12px;font-family:'SF Mono',Monaco,monospace;font-variant-numeric:tabular-nums}
.fin-row.bold{border-top:1px solid rgba(31,30,29,.08);margin-top:2px}
.fin-row.bold .fr-label{font-weight:600;color:#141413}
.fin-row.bold .fr-val{font-weight:600}
.fin-total{display:flex;justify-content:space-between;padding:10px 12px;background:rgba(31,30,29,.04);border-radius:8px;margin:8px 4px}
.fin-total .ft-label{font-size:13px;font-weight:600;color:#141413}
.fin-total .ft-val{font-size:14px;font-weight:700;font-family:'SF Mono',Monaco,monospace}

/* Health ring */
.health-ring{position:relative;display:flex;align-items:center;justify-content:center}
.health-ring .hr-val{position:absolute;font-size:12px;font-weight:700;font-variant-numeric:tabular-nums}
.eng-card{border:1px solid rgba(31,30,29,.1);border-radius:12px;padding:12px;margin-bottom:8px;background:#fff}
.eng-header{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.eng-name{font-size:13px;font-weight:600;color:#141413}
.eng-sub{font-size:11px;color:#73726c}
.alert-banner{display:flex;align-items:flex-start;gap:8px;padding:10px 12px;border-radius:10px;margin-bottom:8px}
.alert-banner.crit{background:rgba(220,38,38,.04);border:1px solid rgba(220,38,38,.12)}
.alert-banner.warn{background:rgba(217,119,6,.04);border:1px solid rgba(217,119,6,.12)}
.tech-chip{display:inline-block;padding:2px 7px;border-radius:4px;font-size:10px;font-weight:500;background:rgba(37,99,235,.06);color:#2563eb;border:1px solid rgba(37,99,235,.1);margin:2px}

/* GST */
.gst-row{display:flex;align-items:center;justify-content:space-between;padding:7px 12px;transition:background .1s}
.gst-row:hover{background:rgba(31,30,29,.03)}
.gst-box{font-size:10px;font-family:'SF Mono',Monaco,monospace;font-weight:700;color:#73726c;margin-right:8px}
.gst-label{font-size:12px;flex:1;color:#3d3d3a}
.gst-note{font-size:10px;color:#73726c}
.gst-val{font-size:12px;font-family:'SF Mono',Monaco,monospace;font-variant-numeric:tabular-nums;margin-left:8px;color:#141413}
.gst-row.hl{background:rgba(31,30,29,.04);border-top:1px solid rgba(31,30,29,.08);margin-top:4px}
.gst-row.hl .gst-label{font-weight:600;color:#141413}
.gst-row.hl .gst-val{font-weight:700}
.balance-check{margin:8px;padding:8px 12px;border-radius:8px;font-size:11px;font-weight:500;display:flex;align-items:center;gap:6px}
.balance-check.ok{background:rgba(22,163,74,.06);color:#16a34a;border:1px solid rgba(22,163,74,.12)}
.balance-check.bad{background:rgba(220,38,38,.06);color:#dc2626;border:1px solid rgba(220,38,38,.12)}
.green{color:#16a34a}.red{color:#dc2626}.amber{color:#d97706}.blue{color:#2563eb}.purple{color:#7c3aed}.white{color:#141413}

/* Resizable dividers */
.resize-handle{width:5px;cursor:col-resize;background:transparent;flex-shrink:0;position:relative;z-index:10;transition:background .2s}
.resize-handle:hover,.resize-handle.dragging{background:rgba(198,97,63,.3)}
.resize-handle::after{content:'';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:3px;height:32px;border-radius:2px;background:rgba(31,30,29,.15);opacity:0;transition:opacity .2s}
.resize-handle:hover::after,.resize-handle.dragging::after{opacity:1;background:#c6613f}

/* Overlay pages (Connectors, Settings, Artifacts list) */
.overlay-page{position:absolute;top:0;left:0;right:0;bottom:0;background:#faf9f5;z-index:50;display:none;flex-direction:column;overflow:hidden}
.overlay-page.show{display:flex}
.overlay-header{display:flex;align-items:center;gap:12px;padding:16px 24px;border-bottom:1px solid rgba(31,30,29,.1);flex-shrink:0}
.overlay-header h3{font-size:16px;font-weight:600;color:#141413;flex:1}
.overlay-close{width:32px;height:32px;border-radius:8px;border:none;background:none;color:#73726c;cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center}
.overlay-close:hover{background:rgba(31,30,29,.08);color:#141413}
.overlay-body{flex:1;overflow-y:auto;padding:24px}
.overlay-body::-webkit-scrollbar{width:4px}
.overlay-body::-webkit-scrollbar-thumb{background:rgba(31,30,29,.15);border-radius:2px}

/* Connector cards */
.connector-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.connector-card{border:1px solid rgba(31,30,29,.1);border-radius:12px;padding:16px;background:#fff;cursor:pointer;transition:all .15s}
.connector-card:hover{border-color:rgba(198,97,63,.3);box-shadow:0 2px 8px rgba(0,0,0,.04)}
.connector-card.connected{border-color:rgba(22,163,74,.3)}
.cc-header{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.cc-icon{width:36px;height:36px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:18px}
.cc-name{font-size:14px;font-weight:600;color:#141413}
.cc-desc{font-size:12px;color:#73726c;line-height:1.4;margin-bottom:10px}
.cc-status{font-size:11px;font-weight:500;padding:3px 8px;border-radius:6px;display:inline-flex;align-items:center;gap:4px}
.cc-status.on{background:rgba(22,163,74,.08);color:#16a34a}
.cc-status.off{background:rgba(31,30,29,.06);color:#73726c}
.cc-section-title{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.8px;color:#73726c;margin:20px 0 10px;padding-bottom:6px;border-bottom:1px solid rgba(31,30,29,.06)}
.cc-section-title:first-child{margin-top:0}

/* Settings page */
.settings-nav{display:flex;gap:2px;padding:0 24px 16px;border-bottom:1px solid rgba(31,30,29,.06);margin-bottom:16px}
.settings-tab{padding:6px 14px;border-radius:8px;font-size:13px;font-weight:500;color:#73726c;cursor:pointer;border:none;background:none;transition:all .15s}
.settings-tab:hover{color:#3d3d3a;background:rgba(31,30,29,.06)}
.settings-tab.active{color:#141413;background:rgba(31,30,29,.08);font-weight:600}
.settings-section{margin-bottom:24px}
.settings-section h4{font-size:14px;font-weight:600;color:#141413;margin-bottom:12px}
.settings-field{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid rgba(31,30,29,.04)}
.settings-field label{font-size:13px;color:#3d3d3a}
.settings-field .sf-val{font-size:13px;color:#141413;font-weight:500}
.org-card{border:1px solid rgba(31,30,29,.1);border-radius:12px;padding:14px;background:#fff;margin-bottom:8px;cursor:pointer;transition:all .15s;display:flex;align-items:center;gap:12px}
.org-card:hover{border-color:rgba(198,97,63,.3);background:rgba(198,97,63,.02)}
.org-card.active-org{border-color:#c6613f;background:rgba(198,97,63,.04)}
.org-avatar-lg{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:#fff;flex-shrink:0}
.org-info{flex:1}
.org-info .org-title{font-size:14px;font-weight:600;color:#141413}
.org-info .org-detail{font-size:11px;color:#73726c}

function sbar(val,label,mx=100){const p=Math.min(100,Math.max(0,(val||0)/mx*100)),c=p>=75?'#16a34a':p>=50?'#ca8a04':'#dc2626';return`<div class="score-bar"><div class="score-bar-label"><span>${label}</span><span style="color:${c}">${Math.round(val||0)}</span></div><div class="score-bar-track"><div class="score-bar-fill" style="width:${p}%;background:${c}"></div></div></div>`}

function renderHist(){const l=document.getElementById('hist-list');if(!hist.length){l.innerHTML='<div style="padding:4px 10px;font-size:11px;color:#73726c">No previous chats</div>';return;}l.innerHTML=hist.slice(-5).reverse().map(h=>`<div class="hist-item">${h}</div>`).join('');}

function setService(s){svc=s;selCmd=null;msgs=[];artTabState={};document.querySelectorAll('.svc-tab').forEach(t=>t.classList.remove('active'));document.getElementById('tab-'+s).classList.add('active');renderCmds();renderChat();document.getElementById('art-wrap').innerHTML='<div class="art-empty"><div class="ae-icon">✦</div><h4>No artifact yet</h4><p>Click a command to see results</p></div>';renderHist();}
function clickCmd(id){let cmd;for(const g of getCmds())for(const i of g.items)if(i.id===id)cmd=i;if(!cmd)return;if(msgs.length>1){const f=msgs.find(m=>m.r==='user');hist.push(f?f.c.slice(0,40)+'...':'Untitled');}selCmd=id;msgs=[{t:'badge'},{r:'user',c:cmd.p},{t:'typing'}];renderCmds();renderChat();renderHist();setTimeout(()=>{const r=RESP[id]||{sum:'Analysis complete.',art:'general'};msgs.pop();msgs.push({r:'asst',c:r.sum,art:r.art||id});renderChat();renderArt(r.art||id);},800);}
function newChat(){if(msgs.length>1){const f=msgs.find(m=>m.r==='user');hist.push(f?f.c.slice(0,40)+'...':'Untitled');}selCmd=null;msgs=[];artTabState={};renderCmds();renderChat();renderHist();document.getElementById('art-wrap').innerHTML='<div class="art-empty"><div class="ae-icon">✦</div><h4>No artifact yet</h4><p>Click a command to see results</p></div>';}
function sendChat(){const inp=document.getElementById('chat-input'),txt=inp.value.trim();if(!txt)return;inp.value='';if(!msgs.length)msgs.push({t:'badge'});msgs.push({r:'user',c:txt},{t:'typing'});renderChat();setTimeout(()=>{msgs.pop();msgs.push({r:'asst',c:'I\'ve analyzed your request across the intelligence graph. Several patterns and insights correlate with your query.'});renderChat();},600);}
function toggleHist(){histOpen=!histOpen;document.getElementById('hist-section').classList.toggle('open',histOpen);}
function toggleOrg(){/* could add org menu */}

renderCmds();renderChat();renderHist();
</script>
</body>
