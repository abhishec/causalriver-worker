version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm install -g pnpm@9
        - cd website && pnpm install
    build:
      commands:
        - cd website && npx next build
  artifacts:
    baseDirectory: website/out
    files:
      - "**/*"
  cache:
    paths:
      - website/node_modules/**/*
      - website/.next/cache/**/*
