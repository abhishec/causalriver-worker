version: 1
applications:
  - appRoot: website
    frontend:
      phases:
        preBuild:
          commands:
            - npm install -g pnpm@9
            - pushd .. && pnpm install --frozen-lockfile && popd
        build:
          commands:
            - npx next build
      artifacts:
        baseDirectory: out
        files:
          - '**/*'
      cache:
        paths:
          - .next/cache/**/*
          - node_modules/**/*
          - ../node_modules/**/*
      customHeaders:
        - pattern: '**/*'
          headers:
            - key: Cache-Control
              value: public, max-age=3600, s-maxage=86400
        - pattern: '/_next/static/**'
          headers:
            - key: Cache-Control
              value: public, max-age=31536000, immutable
